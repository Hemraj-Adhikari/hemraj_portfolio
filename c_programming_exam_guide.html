let activeSection = "theory";
let openQ = null;

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = sections.map(s => `
    <button class="tab-btn ${s.id === activeSection ? 'active' : ''}"
      style="${s.id === activeSection ? 'background:' + s.color : ''}"
      onclick="setSection('${s.id}')">${s.label}</button>
  `).join('');
}

function setSection(id) {
  activeSection = id;
  openQ = null;
  document.getElementById('search').value = '';
  renderTabs();
  renderQuestions();
}

function renderQuestions() {
  const search = document.getElementById('search').value.toLowerCase();
  const current = sections.find(s => s.id === activeSection);
  const filtered = current.questions.filter(
    q => q.q.toLowerCase().includes(search) || q.a.toLowerCase().includes(search)
  );
  document.getElementById('count').textContent = `Showing ${filtered.length} questions`;
  const qEl = document.getElementById('questions');
  qEl.innerHTML = filtered.map((item, idx) => `
    <div class="q-card ${openQ === idx ? 'open' : ''}" style="--accent:${current.color}" id="card-${idx}">
      <button class="q-btn" onclick="toggleQ(${idx})">
        <span>${escHtml(item.q)}</span>
        <span class="arrow" style="color:${current.color}">${openQ === idx ? '▲' : '▼'}</span>
      </button>
      <div class="q-answer">
        <pre>${escHtml(item.a)}</pre>
      </div>
    </div>
  `).join('');
}

function toggleQ(idx) {
  openQ = openQ === idx ? null : idx;
  renderQuestions();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderTabs();
renderQuestions();
</script>
