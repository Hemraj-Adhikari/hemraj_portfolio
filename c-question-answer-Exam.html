{
  id:'u6', title:'Pointers', short:'Pointers',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define pointer.',
        a:`<p>A <strong>pointer</strong> is a variable that stores the <strong>memory address</strong> of another variable. Instead of holding a data value directly, it holds the location where the data is stored.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>pointer.c</span></div><pre><span class="kw">int</span> x = <span class="num">10</span>;
<span class="kw">int</span> *ptr = &amp;x;   <span class="cm">// ptr stores address of x</span>
<span class="fn">printf</span>(<span class="str">"%p"</span>, ptr);   <span class="cm">// Prints memory address</span>
<span class="fn">printf</span>(<span class="str">"%d"</span>, *ptr);  <span class="cm">// Dereference: prints 10</span></pre></div>`},
      { q:'What is a NULL pointer?',
        a:`<p>A <strong>NULL pointer</strong> is a pointer that points to nothing (address 0). It is used to indicate that a pointer is not currently pointing to any valid memory location.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>null.c</span></div><pre><span class="kw">int</span> *ptr = NULL;    <span class="cm">// Safe initialization</span>
<span class="kw">if</span>(ptr != NULL)     <span class="cm">// Always check before using!</span>
    <span class="fn">printf</span>(<span class="str">"%d"</span>, *ptr);
<span class="cm">// Dereferencing NULL → Segmentation fault / crash!</span></pre></div>
        <div class="ib imp"><strong>Best Practice</strong>Always initialize pointers to NULL and check before dereferencing.</div>`},
      { q:'What is pointer arithmetic?',
        a:`<p><strong>Pointer arithmetic</strong> means performing arithmetic operations (+, -, ++, --) on pointer variables. The operations work in units of the pointed-to data type.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>ptr_arith.c</span></div><pre><span class="kw">int</span> arr[] = {<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>};
<span class="kw">int</span> *p = arr;
p++;                   <span class="cm">// Moves 4 bytes forward (sizeof int)</span>
<span class="fn">printf</span>(<span class="str">"%d"</span>, *p);    <span class="cm">// 20 — now points to arr[1]</span></pre></div>
        <p>If int is 4 bytes: p++ moves pointer by 4 bytes, not 1 byte.</p>`},
      { q:'Differentiate pointer and variable.',
        a:`<div class="tbl-wrap"><table><tr><th>Variable</th><th>Pointer</th></tr>
        <tr><td>Stores actual data value</td><td>Stores memory address</td></tr>
        <tr><td>int x = 10;</td><td>int *p = &amp;x;</td></tr>
        <tr><td>Direct access to value</td><td>Indirect access via dereference (*p)</td></tr>
        <tr><td>Size = size of data type</td><td>Size = 4 or 8 bytes (address size)</td></tr>
        </table></div>`},
      { q:'What is dereferencing?',
        a:`<p><strong>Dereferencing</strong> is the operation of accessing the value stored at the memory address held by a pointer, using the <code>*</code> (dereference) operator.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>deref.c</span></div><pre><span class="kw">int</span> x = <span class="num">42</span>;
<span class="kw">int</span> *p = &amp;x;    <span class="cm">// p holds address of x</span>
<span class="fn">printf</span>(<span class="str">"%d"</span>, *p);  <span class="cm">// *p = dereference = value AT address = 42</span>
*p = <span class="num">100</span>;          <span class="cm">// Change x via pointer: x is now 100</span></pre></div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Trace the output of a pointer program.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>ptr_trace.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a = <span class="num">10</span>, b = <span class="num">20</span>;
    <span class="kw">int</span> *p = &amp;a, *q = &amp;b;

    <span class="fn">printf</span>(<span class="str">"%d %d\n"</span>, a, b);        <span class="cm">// 10 20</span>
    *p = *p + *q;                      <span class="cm">// a = 10 + 20 = 30</span>
    <span class="fn">printf</span>(<span class="str">"%d %d\n"</span>, a, b);        <span class="cm">// 30 20</span>
    <span class="fn">printf</span>(<span class="str">"%d\n"</span>, *p + *q);        <span class="cm">// 30 + 20 = 50</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <div class="ib imp"><strong>Output</strong><code>10 20<br>30 20<br>50</code></div>`},
      { q:'Explain pointer arithmetic with examples.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>ptr_arith.c</span></div><pre><span class="kw">int</span> arr[] = {<span class="num">100</span>, <span class="num">200</span>, <span class="num">300</span>, <span class="num">400</span>};
<span class="kw">int</span> *p = arr;          <span class="cm">// p → arr[0]</span>

<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *p);        <span class="cm">// 100</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *(p+<span class="num">1</span>));   <span class="cm">// 200 — arr[1]</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *(p+<span class="num">2</span>));   <span class="cm">// 300 — arr[2]</span>
p++;                        <span class="cm">// p now → arr[1]</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, *p);        <span class="cm">// 200</span>

<span class="cm">// Difference between two pointers</span>
<span class="kw">int</span> *q = &amp;arr[<span class="num">3</span>];
<span class="fn">printf</span>(<span class="str">"%ld\n"</span>, q - p);    <span class="cm">// 2 (number of elements between)</span></pre></div>`},
      { q:'Analyze the relationship between arrays and pointers.',
        a:`<p>In C, the array name is a <strong>constant pointer</strong> to the first element. You can use pointer notation to access array elements.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>arr_ptr.c</span></div><pre><span class="kw">int</span> arr[] = {<span class="num">10</span>, <span class="num">20</span>, <span class="num">30</span>};
<span class="kw">int</span> *p = arr;        <span class="cm">// arr == &arr[0]</span>

<span class="cm">// These are all equivalent:</span>
arr[<span class="num">1</span>]    == *(arr+<span class="num">1</span>)  == p[<span class="num">1</span>]  == *(p+<span class="num">1</span>);  <span class="cm">// All = 20</span>
&amp;arr[<span class="num">2</span>]  == arr+<span class="num">2</span>     == p+<span class="num">2</span>;               <span class="cm">// All = address of 3rd</span></pre></div>
        <div class="ib warn"><strong>Key Difference</strong>arr is a constant pointer (cannot do arr++), but p is a regular pointer (p++ is valid).</div>`},
      { q:'Explain advantages of pointers.',
        a:`<ul>
        <li><strong>Dynamic Memory</strong> — Allocate memory at runtime with malloc/calloc</li>
        <li><strong>Efficient Array Access</strong> — Faster than subscript notation</li>
        <li><strong>Call by Reference</strong> — Allows functions to modify caller's variables</li>
        <li><strong>Data Structures</strong> — Build linked lists, trees, stacks with pointers</li>
        <li><strong>Function Pointers</strong> — Point to functions, enabling callbacks</li>
        <li><strong>String Manipulation</strong> — Efficient character-by-character processing</li>
        </ul>`},
      { q:'Compare call by value and pointer-based parameter passing.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>compare.c</span></div><pre><span class="cm">// Call by Value — original unchanged</span>
<span class="kw">void</span> <span class="fn">doubleVal</span>(<span class="kw">int</span> x) { x = x * <span class="num">2</span>; }

<span class="cm">// Call by Reference (pointer) — original changed</span>
<span class="kw">void</span> <span class="fn">doubleRef</span>(<span class="kw">int</span> *x) { *x = *x * <span class="num">2</span>; }

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a = <span class="num">5</span>;
    <span class="fn">doubleVal</span>(a);       <span class="cm">// a still = 5</span>
    <span class="fn">doubleRef</span>(&amp;a);      <span class="cm">// a now = 10</span>
    <span class="fn">printf</span>(<span class="str">"%d"</span>, a);    <span class="cm">// 10</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Write a program to swap two numbers using pointers.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>swap_ptr.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">void</span> <span class="fn">swap</span>(<span class="kw">int</span> *a, <span class="kw">int</span> *b) {
    <span class="kw">int</span> temp = *a;
    *a = *b;
    *b = temp;
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> x, y;
    <span class="fn">printf</span>(<span class="str">"Enter two numbers: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;x, &amp;y);

    <span class="fn">printf</span>(<span class="str">"Before: x=%d, y=%d\n"</span>, x, y);
    <span class="fn">swap</span>(&amp;x, &amp;y);   <span class="cm">// Pass addresses</span>
    <span class="fn">printf</span>(<span class="str">"After:  x=%d, y=%d\n"</span>, x, y);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Explain pointer arithmetic and its applications.',
        a:`<h4>Pointer Arithmetic Rules</h4>
        <ul><li>ptr + n → moves n × sizeof(type) bytes forward</li>
        <li>ptr - n → moves n × sizeof(type) bytes backward</li>
        <li>ptr1 - ptr2 → number of elements between two pointers</li>
        <li>Only +, -, ++, -- are valid (no *, /, %)</li></ul>
        <h4>Applications</h4>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>applications.c</span></div><pre><span class="cm">// 1. Traverse array with pointer</span>
<span class="kw">int</span> arr[]={<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>,<span class="num">4</span>,<span class="num">5</span>}, *p=arr;
<span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;<span class="num">5</span>; i++)
    <span class="fn">printf</span>(<span class="str">"%d "</span>, *(p+i));  <span class="cm">// 1 2 3 4 5</span>

<span class="cm">// 2. Traverse string with pointer</span>
<span class="kw">char</span> *s = <span class="str">"Hello"</span>;
<span class="kw">while</span>(*s != <span class="str">'\0'</span>) {
    <span class="fn">printf</span>(<span class="str">"%c"</span>, *s);
    s++;
}</pre></div>`},
      { q:'Develop a program using pointers to find largest element in an array.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>max_ptr.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">int</span> <span class="fn">findMax</span>(<span class="kw">int</span> *arr, <span class="kw">int</span> n) {
    <span class="kw">int</span> max = *arr;
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;n; i++) {
        <span class="kw">if</span>(*(arr+i) &gt; max)
            max = *(arr+i);
    }
    <span class="kw">return</span> max;
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> arr[] = {<span class="num">45</span>, <span class="num">12</span>, <span class="num">78</span>, <span class="num">34</span>, <span class="num">90</span>, <span class="num">23</span>};
    <span class="kw">int</span> n = <span class="num">6</span>;
    <span class="fn">printf</span>(<span class="str">"Largest = %d\n"</span>, <span class="fn">findMax</span>(arr, n));  <span class="cm">// 90</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Explain pointers and functions with suitable examples.',
        a:`<h4>Passing Pointer to Function</h4>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>ptr_func.c</span></div><pre><span class="cm">// Function modifies original via pointer</span>
<span class="kw">void</span> <span class="fn">increment</span>(<span class="kw">int</span> *n) { (*n)++; }

<span class="cm">// Return pointer from function</span>
<span class="kw">int</span>* <span class="fn">largest</span>(<span class="kw">int</span> *a, <span class="kw">int</span> *b) {
    <span class="kw">return</span> (*a &gt; *b) ? a : b;
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> x = <span class="num">5</span>;
    <span class="fn">increment</span>(&amp;x);          <span class="cm">// x becomes 6</span>
    <span class="fn">printf</span>(<span class="str">"%d\n"</span>, x);      <span class="cm">// 6</span>

    <span class="kw">int</span> a=<span class="num">10</span>, b=<span class="num">20</span>;
    <span class="kw">int</span> *big = <span class="fn">largest</span>(&amp;a, &amp;b);
    <span class="fn">printf</span>(<span class="str">"Largest: %d\n"</span>, *big);  <span class="cm">// 20</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Compare static memory allocation and dynamic memory allocation.',
        a:`<div class="tbl-wrap"><table><tr><th>Static Memory</th><th>Dynamic Memory</th></tr>
        <tr><td>Allocated at compile time</td><td>Allocated at run time</td></tr>
        <tr><td>Fixed size — cannot change</td><td>Flexible size — can grow/shrink</td></tr>
        <tr><td>Stored in stack/data segment</td><td>Stored in heap segment</td></tr>
        <tr><td>Automatically freed</td><td>Must free manually with free()</td></tr>
        <tr><td>int arr[100];</td><td>int *p = malloc(n * sizeof(int));</td></tr>
        </table></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>dynamic.c</span></div><pre><span class="hd">#include &lt;stdlib.h&gt;</span>
<span class="kw">int</span> n = <span class="num">5</span>;
<span class="kw">int</span> *p = (<span class="kw">int</span>*)<span class="fn">malloc</span>(n * <span class="kw">sizeof</span>(<span class="kw">int</span>));  <span class="cm">// Allocate</span>
<span class="kw">if</span>(p == NULL) { <span class="fn">printf</span>(<span class="str">"Failed\n"</span>); }
<span class="cm">// ... use p[0] to p[n-1] ...</span>
<span class="fn">free</span>(p);   <span class="cm">// Must free!</span></pre></div>`},
    ]},
  ]
},
{
  id:'u7', title:'Structures, Unions and Enumerations', short:'Structures & Unions',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define structure.',
        a:`<p>A <strong>structure</strong> is a user-defined data type in C that groups variables of <strong>different data types</strong> under a single name. Each member has its own memory location.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>struct.c</span></div><pre><span class="kw">struct</span> Student {
    <span class="kw">int</span>   roll;
    <span class="kw">char</span>  name[<span class="num">50</span>];
    <span class="kw">float</span> marks;
};
<span class="kw">struct</span> Student s1;   <span class="cm">// Create a Student variable</span>
s1.roll = <span class="num">101</span>;       <span class="cm">// Access with dot (.) operator</span></pre></div>`},
      { q:'What is union?',
        a:`<p>A <strong>union</strong> is similar to a structure, but all members <strong>share the same memory location</strong>. Only one member can hold a value at a time. The size of a union = size of its largest member.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>union.c</span></div><pre><span class="kw">union</span> Data {
    <span class="kw">int</span>   i;     <span class="cm">// 4 bytes</span>
    <span class="kw">float</span> f;     <span class="cm">// 4 bytes</span>
    <span class="kw">char</span>  c;     <span class="cm">// 1 byte</span>
};
<span class="cm">// Size of union = 4 bytes (largest member)</span>
<span class="cm">// Only one member valid at a time!</span></pre></div>`},
      { q:'Differentiate structure and union.',
        a:`<div class="tbl-wrap"><table><tr><th>Structure</th><th>Union</th></tr>
        <tr><td>Each member has own memory</td><td>All members share same memory</td></tr>
        <tr><td>Size = sum of all members</td><td>Size = largest member's size</td></tr>
        <tr><td>All members can hold values</td><td>Only one member active at a time</td></tr>
        <tr><td>Used to represent entities</td><td>Used for memory efficiency</td></tr>
        <tr><td>struct keyword</td><td>union keyword</td></tr>
        </table></div>`},
      { q:'Define enumeration.',
        a:`<p>An <strong>enumeration (enum)</strong> is a user-defined data type that assigns symbolic names (identifiers) to integer constants, making code more readable.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>enum.c</span></div><pre><span class="kw">enum</span> Day { SUN=<span class="num">0</span>, MON, TUE, WED, THU, FRI, SAT };
<span class="kw">enum</span> Day today = WED;
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, today);  <span class="cm">// 3 (WED is 3rd, starting from 0)</span></pre></div>
        <p>Default values start at 0 and increment by 1 unless explicitly set.</p>`},
      { q:'What is nested structure?',
        a:`<p>A <strong>nested structure</strong> is a structure that contains another structure as one of its members.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>nested_struct.c</span></div><pre><span class="kw">struct</span> Date { <span class="kw">int</span> day, month, year; };

<span class="kw">struct</span> Employee {
    <span class="kw">char</span>        name[<span class="num">50</span>];
    <span class="kw">int</span>         salary;
    <span class="kw">struct</span> Date dob;     <span class="cm">// Nested structure</span>
};

<span class="kw">struct</span> Employee e1;
e1.dob.day = <span class="num">15</span>;     <span class="cm">// Access nested member</span>
e1.dob.year = <span class="num">1990</span>;</pre></div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Analyze memory allocation in structures and unions.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>memory.c</span></div><pre><span class="kw">struct</span> S { <span class="kw">int</span> i; <span class="kw">float</span> f; <span class="kw">char</span> c; };
<span class="cm">// Size = 4 + 4 + 1 = 9 bytes (+ padding → often 12)</span>

<span class="kw">union</span> U { <span class="kw">int</span> i; <span class="kw">float</span> f; <span class="kw">char</span> c; };
<span class="cm">// Size = 4 bytes (largest member = int or float)</span>

<span class="fn">printf</span>(<span class="str">"struct S: %lu bytes\n"</span>, <span class="kw">sizeof</span>(<span class="kw">struct</span> S));
<span class="fn">printf</span>(<span class="str">"union  U: %lu bytes\n"</span>, <span class="kw">sizeof</span>(<span class="kw">union</span> U));</pre></div>
        <div class="ib warn"><strong>Structure Padding</strong>Compiler may add padding bytes between members to align data at word boundaries (e.g., int must start at address divisible by 4).</div>`},
      { q:'Explain enumeration with examples.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>enum.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">enum</span> Season { SPRING=<span class="num">1</span>, SUMMER, AUTUMN, WINTER };
<span class="kw">enum</span> Color  { RED, GREEN=<span class="num">5</span>, BLUE };  <span class="cm">// RED=0, GREEN=5, BLUE=6</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">enum</span> Season s = SUMMER;
    <span class="kw">switch</span>(s) {
        <span class="kw">case</span> SPRING: <span class="fn">printf</span>(<span class="str">"Spring!\n"</span>); <span class="kw">break</span>;
        <span class="kw">case</span> SUMMER: <span class="fn">printf</span>(<span class="str">"Summer!\n"</span>); <span class="kw">break</span>;
        <span class="kw">default</span>:     <span class="fn">printf</span>(<span class="str">"Other\n"</span>);
    }
    <span class="kw">return</span> <span class="num">0</span>;  <span class="cm">// Output: Summer!</span>
}</pre></div>`},
      { q:'Compare arrays and structures.',
        a:`<div class="tbl-wrap"><table><tr><th>Array</th><th>Structure</th></tr>
        <tr><td>Homogeneous (same type)</td><td>Heterogeneous (different types)</td></tr>
        <tr><td>int arr[5];</td><td>struct Student s;</td></tr>
        <tr><td>Access: arr[i]</td><td>Access: s.roll, s.name</td></tr>
        <tr><td>Elements have no names (just index)</td><td>Members have descriptive names</td></tr>
        <tr><td>No keyword needed</td><td>Needs struct keyword</td></tr>
        </table></div>`},
      { q:'Explain nested structures.',
        a:`<p>When a structure contains another structure as a member, it is called a nested structure. This models real-world entities that have sub-entities.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>nested.c</span></div><pre><span class="kw">struct</span> Address {
    <span class="kw">char</span> city[<span class="num">30</span>];
    <span class="kw">int</span>  pincode;
};
<span class="kw">struct</span> Person {
    <span class="kw">char</span>           name[<span class="num">50</span>];
    <span class="kw">int</span>            age;
    <span class="kw">struct</span> Address addr;    <span class="cm">// Nested structure</span>
};
<span class="kw">struct</span> Person p = {<span class="str">"Ram"</span>, <span class="num">25</span>, {<span class="str">"Kathmandu"</span>, <span class="num">44600</span>}};
<span class="fn">printf</span>(<span class="str">"%s lives in %s\n"</span>, p.name, p.addr.city);</pre></div>`},
      { q:'Discuss applications of structures.',
        a:`<p>Structures are used whenever we need to group related data of different types:</p>
        <ul>
        <li><strong>Student Records</strong> — name, roll, marks, grade</li>
        <li><strong>Employee Database</strong> — ID, name, salary, department</li>
        <li><strong>Book Library</strong> — title, author, ISBN, price</li>
        <li><strong>Date/Time</strong> — day, month, year, hour, minute</li>
        <li><strong>Geometric Shapes</strong> — Point (x, y), Rectangle (width, height)</li>
        <li><strong>Linked Lists/Trees</strong> — node with data and pointer to next node</li>
        </ul>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Write a program to store and display student records using structures.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>student.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">struct</span> Student {
    <span class="kw">int</span>   roll;
    <span class="kw">char</span>  name[<span class="num">50</span>];

    <span class="kw">char</span>  grade;
};

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> n;
    <span class="fn">printf</span>(<span class="str">"How many students? "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;n);

    <span class="kw">struct</span> Student s[n];

    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;n; i++) {

        <span class="kw">else if</span>(s[i].marks &gt;= <span class="num">60</span>) s[i].grade = <span class="str">'B'</span>;
        <span class="kw">else if</span>(s[i].marks &gt;= <span class="num">40</span>) s[i].grade = <span class="str">'C'</span>;
        <span class="kw">else</span>                       s[i].grade = <span class="str">'F'</span>;
    }

    <span class="fn">printf</span>(<span class="str">"\n%-5s %-15s %-8s %s\n"</span>,<span class="str">"Roll"</span>,<span class="str">"Name"</span>,<span class="str">"Marks"</span>,<span class="str">"Grade"</span>);
    <span class="fn">printf</span>(<span class="str">"%-5s %-15s %-8s %s\n"</span>,<span class="str">"----"</span>,<span class="str">"----"</span>,<span class="str">"-----"</span>,<span class="str">"-----"</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;n; i++)
        <span class="fn">printf</span>(<span class="str">"%-5d %-15s %-8.2f %c\n"</span>, s[i].roll,s[i].name,s[i].marks,s[i].grade);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Compare structures and unions with suitable examples.',
        a:`<div class="tbl-wrap"><table><tr><th>Feature</th><th>Structure</th><th>Union</th></tr>
        <tr><td>Keyword</td><td>struct</td><td>union</td></tr>
        <tr><td>Memory</td><td>Sum of all members</td><td>Largest member only</td></tr>
        <tr><td>Member access</td><td>All members simultaneously</td><td>One member at a time</td></tr>
        <tr><td>Use case</td><td>Represent entities with multiple attributes</td><td>Memory-efficient type variants</td></tr>
        </table></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>compare.c</span></div><pre><span class="kw">struct</span> S { <span class="kw">int</span> i; <span class="kw">float</span> f; };
<span class="kw">union</span>  U { <span class="kw">int</span> i; <span class="kw">float</span> f; };

<span class="kw">struct</span> S sv; sv.i = <span class="num">5</span>; sv.f = <span class="num">3.14</span>;
<span class="fn">printf</span>(<span class="str">"%d %.2f\n"</span>, sv.i, sv.f);  <span class="cm">// 5 3.14 (both valid)</span>

<span class="kw">union</span>  U uv; uv.i = <span class="num">5</span>;
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, uv.i);             <span class="cm">// 5</span>
uv.f = <span class="num">3.14</span>;                       <span class="cm">// Now f is valid, i is corrupted</span>
<span class="fn">printf</span>(<span class="str">"%.2f\n"</span>, uv.f);           <span class="cm">// 3.14</span></pre></div>`},
      { q:'Develop a program using array of structures.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>arr_struct.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">struct</span> Book {
    <span class="kw">char</span>  title[<span class="num">50</span>];
    <span class="kw">char</span>  author[<span class="num">40</span>];
    <span class="kw">float</span> price;
};

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">struct</span> Book library[<span class="num">3</span>] = {
        {<span class="str">"C Programming"</span>, <span class="str">"Kernighan"</span>, <span class="num">450.0</span>},
        {<span class="str">"Data Structures"</span>, <span class="str">"Cormen"</span>, <span class="num">850.0</span>},
        {<span class="str">"Algorithms"</span>, <span class="str">"Sedgewick"</span>, <span class="num">600.0</span>}
    };

    <span class="fn">printf</span>(<span class="str">"%-20s %-15s %s\n"</span>, <span class="str">"Title"</span>, <span class="str">"Author"</span>, <span class="str">"Price"</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;<span class="num">3</span>; i++)
        <span class="fn">printf</span>(<span class="str">"%-20s %-15s %.2f\n"</span>, library[i].title, library[i].author, library[i].price);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Explain memory representation of structures and unions.',
        a:`<p><strong>Structure</strong> — members stored at separate, sequential memory addresses. Padding may be added for alignment.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>memory.c</span></div><pre><span class="kw">struct</span> Test { <span class="kw">char</span> c; <span class="kw">int</span> i; <span class="kw">double</span> d; };
<span class="cm">// Memory: [c][pad][pad][pad][i i i i][d d d d d d d d]</span>
<span class="cm">// Size:    1   +  3(pad) + 4  +     8   = 16 bytes</span>

<span class="kw">union</span> Test2 { <span class="kw">char</span> c; <span class="kw">int</span> i; <span class="kw">double</span> d; };
<span class="cm">// Memory: [d d d d d d d d] — all share same 8 bytes</span>
<span class="cm">// Size = 8 bytes (size of largest member)</span>

<span class="fn">printf</span>(<span class="str">"%lu %lu\n"</span>, <span class="kw">sizeof</span>(<span class="kw">struct</span> Test), <span class="kw">sizeof</span>(<span class="kw">union</span> Test2));
<span class="cm">// Typically: 16  8</span></pre></div>`},
      { q:'Design a student information management program using structures.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>mgmt.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;string.h&gt;</span>
<span class="hd">#define MAX 100</span>

<span class="kw">struct</span> Student { <span class="kw">int</span> roll; <span class="kw">char</span> name[<span class="num">50</span>]; <span class="kw">float</span> marks; };
<span class="kw">struct</span> Student db[MAX];
<span class="kw">int</span> count = <span class="num">0</span>;

<span class="kw">void</span> <span class="fn">addStudent</span>() {
    <span class="fn">printf</span>(<span class="str">"Roll Name Marks: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d %s %f"</span>, &amp;db[count].roll, db[count].name, &amp;db[count].marks);
    count++;
}
<span class="kw">void</span> <span class="fn">displayAll</span>() {
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;count; i++)
        <span class="fn">printf</span>(<span class="str">"%d %-15s %.2f\n"</span>, db[i].roll, db[i].name, db[i].marks);
}
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> ch;
    <span class="kw">do</span> {
        <span class="fn">printf</span>(<span class="str">"1.Add 2.Display 0.Exit: "</span>);
        <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;ch);
        <span class="kw">if</span>(ch==<span class="num">1</span>) <span class="fn">addStudent</span>();
        <span class="kw">if</span>(ch==<span class="num">2</span>) <span class="fn">displayAll</span>();
    } <span class="kw">while</span>(ch != <span class="num">0</span>);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
  ]
},
{
  id:'u8', title:'File Handling', short:'File Handling',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define file handling.',
        a:`<p><strong>File handling</strong> in C refers to the operations performed on files stored on disk — creating, reading, writing, and modifying data permanently. Without file handling, all data is lost when a program ends.</p>
        <p>C provides file I/O through the <code>FILE</code> pointer type defined in <code>&lt;stdio.h&gt;</code>.</p>
        <p>Key functions: fopen(), fclose(), fprintf(), fscanf(), fgets(), fputs()</p>`},
      { q:'What is fopen()?',
        a:`<p><code>fopen()</code> is a standard library function that opens a file for reading, writing, or appending. It returns a <code>FILE</code> pointer on success, or <code>NULL</code> on failure.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>fopen.c</span></div><pre>FILE *fp = <span class="fn">fopen</span>(<span class="str">"data.txt"</span>, <span class="str">"w"</span>);
<span class="kw">if</span>(fp == NULL) {
    <span class="fn">printf</span>(<span class="str">"Error opening file!\n"</span>);
    <span class="kw">return</span> <span class="num">1</span>;
}</pre></div>
        <p>Syntax: <code>FILE *fopen(const char *filename, const char *mode);</code></p>`},
      { q:'Differentiate text file and binary file.',
        a:`<div class="tbl-wrap"><table><tr><th>Text File</th><th>Binary File</th></tr>
        <tr><td>Stores data as readable characters (ASCII)</td><td>Stores data as raw bytes</td></tr>
        <tr><td>Human readable with text editor</td><td>Not human readable</td></tr>
        <tr><td>Newline '\n' converted to OS line ending</td><td>No conversion — exact bytes stored</td></tr>
        <tr><td>Mode: "r", "w", "a"</td><td>Mode: "rb", "wb", "ab"</td></tr>
        <tr><td>Slower but portable</td><td>Faster, more compact</td></tr>
        </table></div>`},
      { q:'What is EOF?',
        a:`<p><strong>EOF (End of File)</strong> is a special value (typically -1) that indicates the end of a file has been reached during reading.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>eof.c</span></div><pre><span class="kw">int</span> ch;
FILE *fp = <span class="fn">fopen</span>(<span class="str">"file.txt"</span>, <span class="str">"r"</span>);
<span class="kw">while</span>((ch = <span class="fn">fgetc</span>(fp)) != EOF) {  <span class="cm">// Read until end</span>
    <span class="fn">putchar</span>(ch);
}
<span class="fn">fclose</span>(fp);</pre></div>
        <p>Also: <code>feof(fp)</code> returns non-zero when EOF is reached.</p>`},
      { q:'List common file modes in C.',
        a:`<div class="tbl-wrap"><table><tr><th>Mode</th><th>Meaning</th><th>Note</th></tr>
        <tr><td>"r"</td><td>Read only</td><td>File must exist</td></tr>
        <tr><td>"w"</td><td>Write (create/overwrite)</td><td>Creates new or erases existing</td></tr>
        <tr><td>"a"</td><td>Append</td><td>Adds to end of file</td></tr>
        <tr><td>"r+"</td><td>Read + Write</td><td>File must exist</td></tr>
        <tr><td>"w+"</td><td>Write + Read</td><td>Overwrites existing</td></tr>
        <tr><td>"a+"</td><td>Append + Read</td><td>Preserves existing</td></tr>
        <tr><td>"rb","wb","ab"</td><td>Binary modes</td><td>Add 'b' for binary</td></tr>
        </table></div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Analyze file opening modes.',
        a:`<p>File opening modes determine what operations can be performed and what happens to existing file content:</p>
        <ul>
        <li><strong>"r"</strong> — Opens for reading. Fails if file doesn't exist. File pointer at beginning.</li>
        <li><strong>"w"</strong> — Opens for writing. Creates new file or truncates existing to zero length.</li>
        <li><strong>"a"</strong> — Opens for appending. Creates if not exists. File pointer at end — existing content preserved.</li>
        <li><strong>"r+"</strong> — Read and write. File must exist. Pointer at beginning.</li>
        <li><strong>"w+"</strong> — Read and write. Creates or truncates. Pointer at beginning.</li>
        <li><strong>"a+"</strong> — Read and append. Creates if needed. Reading from beginning, writing to end.</li>
        </ul>`},
      { q:'Explain sequential and random file access.',
        a:`<h4>Sequential Access</h4>
        <p>Read/write data one record after another, from beginning to end. Cannot skip ahead easily.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>sequential.c</span></div><pre><span class="cm">// Read sequentially line by line</span>
<span class="kw">char</span> buf[<span class="num">100</span>];
<span class="kw">while</span>(<span class="fn">fgets</span>(buf, <span class="num">100</span>, fp) != NULL)
    <span class="fn">printf</span>(<span class="str">"%s"</span>, buf);</pre></div>
        <h4>Random Access</h4>
        <p>Jump to any position using fseek(). Access specific records directly.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>random.c</span></div><pre><span class="fn">fseek</span>(fp, <span class="num">0</span>, SEEK_END);    <span class="cm">// Jump to end</span>
<span class="fn">fseek</span>(fp, <span class="num">10</span>, SEEK_SET);   <span class="cm">// Jump to byte 10</span>
<span class="fn">ftell</span>(fp);                  <span class="cm">// Get current position</span>
<span class="fn">rewind</span>(fp);                 <span class="cm">// Go back to start</span></pre></div>`},
      { q:'Explain file pointer operations.',
        a:`<div class="tbl-wrap"><table><tr><th>Function</th><th>Purpose</th><th>Example</th></tr>
        <tr><td>fseek(fp,offset,origin)</td><td>Move file pointer to specific position</td><td>fseek(fp,0,SEEK_END)</td></tr>
        <tr><td>ftell(fp)</td><td>Get current file pointer position (bytes from start)</td><td>long pos = ftell(fp);</td></tr>
        <tr><td>rewind(fp)</td><td>Move pointer to beginning of file</td><td>rewind(fp);</td></tr>
        <tr><td>feof(fp)</td><td>Check if end of file reached</td><td>while(!feof(fp))</td></tr>
        </table></div>
        <p>SEEK constants: <code>SEEK_SET</code>=0 (start), <code>SEEK_CUR</code>=1 (current), <code>SEEK_END</code>=2 (end)</p>`},
      { q:'Compare text files and binary files.',
        a:`<div class="tbl-wrap"><table><tr><th>Aspect</th><th>Text File</th><th>Binary File</th></tr>
        <tr><td>Storage</td><td>ASCII characters</td><td>Raw bytes</td></tr>
        <tr><td>Readability</td><td>Human readable</td><td>Machine readable only</td></tr>
        <tr><td>'\n' handling</td><td>Platform-specific translation</td><td>Stored as-is (exact bytes)</td></tr>
        <tr><td>Size</td><td>Larger (number 12345 = 5 bytes)</td><td>Compact (12345 = 4 bytes)</td></tr>
        <tr><td>Speed</td><td>Slower</td><td>Faster</td></tr>
        <tr><td>Modes</td><td>"r","w","a"</td><td>"rb","wb","ab"</td></tr>
        </table></div>`},
      { q:'Discuss common file handling errors.',
        a:`<ul>
        <li><strong>File not found</strong> — fopen() returns NULL when file doesn't exist in "r" mode. Always check!</li>
        <li><strong>Permission denied</strong> — No write permission to directory. Check NULL.</li>
        <li><strong>Disk full</strong> — fwrite()/fprintf() may fail silently. Check return value.</li>
        <li><strong>Not closing file</strong> — Data may not be written to disk. Always call fclose().</li>
        <li><strong>Buffer overflow</strong> — Reading more than allocated. Use fgets(buf, SIZE, fp).</li>
        <li><strong>Reading past EOF</strong> — Always check feof() or NULL return from fgets().</li>
        </ul>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>error_check.c</span></div><pre>FILE *fp = <span class="fn">fopen</span>(<span class="str">"data.txt"</span>, <span class="str">"r"</span>);
<span class="kw">if</span>(fp == NULL) {
    <span class="fn">perror</span>(<span class="str">"Error"</span>);   <span class="cm">// Prints system error message</span>
    <span class="kw">return</span> <span class="num">1</span>;
}</pre></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Write a program to write student records into a file.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>write_file.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">struct</span> Student { <span class="kw">int</span> roll; <span class="kw">char</span> name[<span class="num">50</span>]; <span class="kw">float</span> marks; };

<span class="kw">int</span> <span class="fn">main</span>() {
    FILE *fp = <span class="fn">fopen</span>(<span class="str">"students.txt"</span>, <span class="str">"w"</span>);
    <span class="kw">if</span>(fp == NULL) { <span class="fn">printf</span>(<span class="str">"Cannot open file!\n"</span>); <span class="kw">return</span> <span class="num">1</span>; }

    <span class="kw">int</span> n;
    <span class="fn">printf</span>(<span class="str">"How many students? "</span>);

    }

    <span class="fn">printf</span>(<span class="str">"Records saved to students.txt\n"</span>);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Write a program to read and display file contents.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>read_file.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">int</span> <span class="fn">main</span>() {

      { q:'Explain all file handling functions with examples.',
        a:`<div class="tbl-wrap"><table><tr><th>Function</th><th>Purpose</th><th>Syntax</th></tr>
        <tr><td>fopen()</td><td>Open a file</td><td>FILE *fopen(name, mode)</td></tr>
        <tr><td>fclose()</td><td>Close a file</td><td>fclose(fp)</td></tr>
        <tr><td>fprintf()</td><td>Write formatted text</td><td>fprintf(fp, "%d", n)</td></tr>
        <tr><td>fscanf()</td><td>Read formatted text</td><td>fscanf(fp, "%d", &n)</td></tr>
        <tr><td>fgets()</td><td>Read a line</td><td>fgets(buf, n, fp)</td></tr>
        <tr><td>fputs()</td><td>Write a string</td><td>fputs("text", fp)</td></tr>
        <tr><td>fgetc()</td><td>Read one character</td><td>ch = fgetc(fp)</td></tr>
        <tr><td>fputc()</td><td>Write one character</td><td>fputc('A', fp)</td></tr>
        <tr><td>fseek()</td><td>Move file pointer</td><td>fseek(fp, offset, origin)</td></tr>

      { q:'Develop a program to count characters, words, and lines in a file.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>count.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    FILE *fp = <span class="fn">fopen</span>(<span class="str">"input.txt"</span>, <span class="str">"r"</span>);
    <span class="kw">if</span>(!fp) { <span class="fn">printf</span>(<span class="str">"File not found!\n"</span>); <span class="kw">return</span> <span class="num">1</span>; }

    <span class="kw">int</span> chars=<span class="num">0</span>, words=<span class="num">0</span>, lines=<span class="num">0</span>, inWord=<span class="num">0</span>;
    <span class="kw">int</span> ch;
    <span class="kw">while</span>((ch = <span class="fn">fgetc</span>(fp)) != EOF) {
        chars++;
        <span class="kw">if</span>(ch == <span class="str">'\n'</span>) lines++;
        <span class="kw">if</span>(ch == <span class="str">' '</span> || ch == <span class="str">'\t'</span> || ch == <span class="str">'\n'</span>) inWord = <span class="num">0</span>;
        <span class="kw">else if</span>(!inWord) { inWord = <span class="num">1</span>; words++; }
    }
    <span class="fn">fclose</span>(fp);

    <span class="fn">printf</span>(<span class="str">"Characters: %d\nWords: %d\nLines: %d\n"</span>, chars, words, lines);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Write a program to copy contents from one file to another.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>copy_file.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">char</span> src[<span class="num">50</span>], dst[<span class="num">50</span>];
    <span class="fn">printf</span>(<span class="str">"Source file: "</span>);    <span class="fn">scanf</span>(<span class="str">"%s"</span>, src);
    <span class="fn">printf</span>(<span class="str">"Destination file: "</span>); <span class="fn">scanf</span>(<span class="str">"%s"</span>, dst);

    FILE *fs = <span class="fn">fopen</span>(src, <span class="str">"r"</span>);
    FILE *fd = <span class="fn">fopen</span>(dst, <span class="str">"w"</span>);

    <span class="kw">if</span>(!fs) { <span class="fn">printf</span>(<span class="str">"Source not found!\n"</span>); <span class="kw">return</span> <span class="num">1</span>; }
    <span class="kw">if</span>(!fd) { <span class="fn">printf</span>(<span class="str">"Cannot create destination!\n"</span>); <span class="kw">return</span> <span class="num">1</span>; }

    <span class="kw">int</span> ch;
    <span class="kw">while</span>((ch = <span class="fn">fgetc</span>(fs)) != EOF)
        <span class="fn">fputc</span>(ch, fd);

    <span class="fn">fclose</span>(fs);
    <span class="fn">fclose</span>(fd);
    <span class="fn">printf</span>(<span class="str">"File copied successfully!\n"</span>);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},

  ]
},
{
  id:'u9', title:'Preprocessor Directives and Advanced Concepts', short:'Preprocessor & Advanced',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'What is a preprocessor directive?',
        a:`<p>A <strong>preprocessor directive</strong> is a command that begins with <code>#</code> and is processed by the C preprocessor <strong>before</strong> actual compilation starts. They are not C statements — they don't end with a semicolon.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>directives.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>     <span class="cm">// Include file directive</span>
<span class="hd">#define MAX 100</span>         <span class="cm">// Macro definition directive</span>
<span class="hd">#ifdef DEBUG</span>            <span class="cm">// Conditional compilation directive</span>
<span class="hd">#endif</span></pre></div>`},
      { q:'Define macro.',
        a:`<p>A <strong>macro</strong> is an identifier defined using <code>#define</code> that is replaced by its value/expression by the preprocessor before compilation. They are text substitutions — not functions.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>macro.c</span></div><pre><span class="hd">#define PI 3.14159</span>                   <span class="cm">// Object-like macro</span>
<span class="hd">#define SQUARE(x) ((x) * (x))</span>        <span class="cm">// Function-like macro</span>
<span class="hd">#define MAX(a,b) ((a)&gt;(b) ? (a):(b))</span> <span class="cm">// With parentheses!</span>

<span class="kw">float</span> area = PI * <span class="fn">SQUARE</span>(<span class="num">5</span>);  <span class="cm">// Replaced before compile</span></pre></div>`},
      { q:'What is a header file?',
        a:`<p>A <strong>header file</strong> is a file with <code>.h</code> extension containing function declarations, macro definitions, and type definitions that can be shared across multiple source files using <code>#include</code>.</p>
        <div class="tbl-wrap"><table><tr><th>Header File</th><th>Contents</th></tr>
        <tr><td>stdio.h</td><td>printf, scanf, FILE, fopen, etc.</td></tr>
        <tr><td>stdlib.h</td><td>malloc, free, exit, rand, etc.</td></tr>
        <tr><td>string.h</td><td>strlen, strcpy, strcmp, etc.</td></tr>
        <tr><td>math.h</td><td>sqrt, pow, sin, cos, etc.</td></tr>
        <tr><td>ctype.h</td><td>isdigit, isalpha, toupper, etc.</td></tr>
        </table></div>`},
      { q:'What is conditional compilation?',
        a:`<p><strong>Conditional compilation</strong> allows selective inclusion or exclusion of code blocks based on conditions evaluated at compile time, using preprocessor directives.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>cond_comp.c</span></div><pre><span class="hd">#define DEBUG</span>

<span class="hd">#ifdef DEBUG</span>
    <span class="fn">printf</span>(<span class="str">"Debug mode: x = %d\n"</span>, x);   <span class="cm">// Compiled only if DEBUG defined</span>
<span class="hd">#endif</span>

<span class="hd">#ifndef RELEASE</span>
    <span class="fn">printf</span>(<span class="str">"This is NOT a release build\n"</span>);
<span class="hd">#endif</span></pre></div>`},
      { q:'Define command-line argument.',
        a:`<p><strong>Command-line arguments</strong> are values passed to a program when it is run from the terminal/command prompt. They are accessed via the <code>argc</code> and <code>argv</code> parameters of <code>main()</code>.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>cmdline.c</span></div><pre><span class="kw">int</span> <span class="fn">main</span>(<span class="kw">int</span> argc, <span class="kw">char</span> *argv[]) {
    <span class="fn">printf</span>(<span class="str">"Program: %s\n"</span>, argv[<span class="num">0</span>]);  <span class="cm">// Program name</span>
    <span class="fn">printf</span>(<span class="str">"Args: %d\n"</span>, argc);          <span class="cm">// Argument count</span>
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;argc; i++)
        <span class="fn">printf</span>(<span class="str">"Arg %d: %s\n"</span>, i, argv[i]);
    <span class="kw">return</span> <span class="num">0</span>;
}
<span class="cm">// Run: ./program Hello World → argc=3</span></pre></div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Compare macros and functions.',
        a:`<div class="tbl-wrap"><table><tr><th>Macro</th><th>Function</th></tr>
        <tr><td>Preprocessor text substitution</td><td>Compiled code block</td></tr>
        <tr><td>No function call overhead</td><td>Overhead for call/return</td></tr>
        <tr><td>No type checking</td><td>Type checking performed</td></tr>
        <tr><td>Code size increases (code inline)</td><td>Code defined once, called multiple times</td></tr>
        <tr><td>Faster execution</td><td>Slightly slower</td></tr>
        <tr><td>Cannot return value</td><td>Can return value</td></tr>
        <tr><td>#define SQUARE(x) ((x)*(x))</td><td>int square(int x){return x*x;}</td></tr>
        </table></div>`},
      { q:'Explain conditional compilation with examples.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>cond.c</span></div><pre><span class="hd">#define WINDOWS</span>

<span class="hd">#ifdef WINDOWS</span>
    <span class="fn">printf</span>(<span class="str">"Running on Windows\n"</span>);
<span class="hd">#elif defined LINUX</span>
    <span class="fn">printf</span>(<span class="str">"Running on Linux\n"</span>);
<span class="hd">#else</span>
    <span class="fn">printf</span>(<span class="str">"Unknown OS\n"</span>);
<span class="hd">#endif</span>

<span class="cm">// Header guard — prevents double inclusion</span>
<span class="hd">#ifndef MYHEADER_H</span>
<span class="hd">#define MYHEADER_H</span>
    <span class="cm">// header content here</span>
<span class="hd">#endif</span>

<span class="cm">// Compile with: gcc -D DEBUG program.c</span>
<span class="hd">#ifdef DEBUG</span>
    <span class="fn">printf</span>(<span class="str">"Debug info here\n"</span>);
<span class="hd">#endif</span></pre></div>`},
      { q:'Analyze the role of header files.',
        a:`<p>Header files serve these important roles:</p>
        <ol>
        <li><strong>Function Declarations</strong> — Prototype declarations allow using functions before their definitions</li>
        <li><strong>Macro Definitions</strong> — Shared constants and macros (e.g., NULL, EOF, INT_MAX)</li>
        <li><strong>Type Definitions</strong> — Shared struct, union, typedef, enum definitions</li>
        <li><strong>Code Sharing</strong> — Same declarations reused across multiple .c files</li>
        <li><strong>Modularity</strong> — Separate interface (header) from implementation (.c)</li>
        </ol>
        <div class="ib tip"><strong>Include Guard Pattern</strong>Always use #ifndef HEADER_H / #define HEADER_H ... #endif to prevent double inclusion.</div>`},
      { q:'Discuss advantages of macros.',
        a:`<ul>
        <li><strong>Speed</strong> — No function call overhead; code is inline substituted</li>
        <li><strong>Generic</strong> — Works with any data type (no type restriction)</li>
        <li><strong>Conditional Code</strong> — Enable/disable code blocks at compile time (#ifdef)</li>
        <li><strong>Named Constants</strong> — More readable than magic numbers: MAX vs 100</li>
        <li><strong>Simple Inline Operations</strong> — Good for very short, frequently used expressions</li>
        </ul>
        <div class="ib warn"><strong>Drawbacks</strong>No type checking, debugging is harder, side effects with expressions like SQUARE(x++) expand to ((x++)*(x++)) = wrong!</div>`},
      { q:'Explain command-line arguments.',
        a:`<p>Command-line arguments allow passing data to a program at execution time from the terminal.</p>
        <ul>
        <li><strong>argc</strong> (argument count) — Total number of arguments including program name</li>
        <li><strong>argv</strong> (argument vector) — Array of strings; argv[0] = program name</li>
        </ul>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>cmd.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;stdlib.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>(<span class="kw">int</span> argc, <span class="kw">char</span> *argv[]) {
    <span class="kw">if</span>(argc != <span class="num">3</span>) {
        <span class="fn">printf</span>(<span class="str">"Usage: %s num1 num2\n"</span>, argv[<span class="num">0</span>]);
        <span class="kw">return</span> <span class="num">1</span>;
    }
    <span class="kw">int</span> a = <span class="fn">atoi</span>(argv[<span class="num">1</span>]);
    <span class="kw">int</span> b = <span class="fn">atoi</span>(argv[<span class="num">2</span>]);
    <span class="fn">printf</span>(<span class="str">"Sum = %d\n"</span>, a + b);
    <span class="kw">return</span> <span class="num">0</span>;
}
<span class="cm">// Run: ./sum 10 20 → Sum = 30</span></pre></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Explain all major preprocessor directives with examples.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>directives.c</span></div><pre><span class="cm">// 1. #include — include header files</span>
<span class="hd">#include &lt;stdio.h&gt;</span>      <span class="cm">// Standard library</span>
<span class="hd">#include "myfile.h"</span>     <span class="cm">// User-defined (current directory)</span>

<span class="cm">// 2. #define — define macro or constant</span>
<span class="hd">#define PI 3.14159</span>
<span class="hd">#define AREA(r) (PI * (r) * (r))</span>

<span class="cm">// 3. #undef — undefine a macro</span>
<span class="hd">#undef PI</span>

<span class="cm">// 4. #ifdef / #ifndef — conditional compilation</span>
<span class="hd">#ifdef DEBUG</span>
    <span class="fn">printf</span>(<span class="str">"Debug mode\n"</span>);
<span class="hd">#endif</span>
<span class="hd">#ifndef RELEASE</span>
    <span class="fn">printf</span>(<span class="str">"Not release\n"</span>);
<span class="hd">#endif</span>

<span class="cm">// 5. #if / #elif / #else / #endif</span>
<span class="hd">#define VERSION 2</span>
<span class="hd">#if VERSION == 1</span>
    <span class="fn">printf</span>(<span class="str">"V1\n"</span>);
<span class="hd">#elif VERSION == 2</span>
    <span class="fn">printf</span>(<span class="str">"V2\n"</span>);
<span class="hd">#else</span>
    <span class="fn">printf</span>(<span class="str">"Other\n"</span>);
<span class="hd">#endif</span>

<span class="cm">// 6. #pragma — compiler-specific instruction</span>
<span class="hd">#pragma once</span>   <span class="cm">// Same as header guard</span>

<span class="cm">// 7. #error — emit error message at compile time</span>
<span class="hd">#if !defined(OS)</span>
<span class="hd">#error "OS must be defined!"</span>
<span class="hd">#endif</span></pre></div>`},
      { q:'Develop a program using user-defined macros.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>macros.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="hd">#define PI        3.14159</span>
<span class="hd">#define SQUARE(x) ((x) * (x))</span>
<span class="hd">#define CUBE(x)   ((x) * (x) * (x))</span>
<span class="hd">#define MAX(a,b)  ((a) &gt; (b) ? (a) : (b))</span>
<span class="hd">#define MIN(a,b)  ((a) &lt; (b) ? (a) : (b))</span>
<span class="hd">#define ABS(x)    ((x) &lt; 0 ? -(x) : (x))</span>
<span class="hd">#define AREA(r)   (PI * SQUARE(r))</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">float</span> r = <span class="num">5.0</span>;
    <span class="fn">printf</span>(<span class="str">"Square of 4    = %.0f\n"</span>, (<span class="kw">float</span>)<span class="fn">SQUARE</span>(<span class="num">4</span>));   <span class="cm">// 16</span>
    <span class="fn">printf</span>(<span class="str">"Cube of 3      = %.0f\n"</span>, (<span class="kw">float</span>)<span class="fn">CUBE</span>(<span class="num">3</span>));     <span class="cm">// 27</span>
    <span class="fn">printf</span>(<span class="str">"Max(10, 20)    = %d\n"</span>, <span class="fn">MAX</span>(<span class="num">10</span>,<span class="num">20</span>));             <span class="cm">// 20</span>
    <span class="fn">printf</span>(<span class="str">"Min(10, 20)    = %d\n"</span>, <span class="fn">MIN</span>(<span class="num">10</span>,<span class="num">20</span>));             <span class="cm">// 10</span>
    <span class="fn">printf</span>(<span class="str">"Abs(-7)        = %d\n"</span>, <span class="fn">ABS</span>(-<span class="num">7</span>));               <span class="cm">// 7</span>
    <span class="fn">printf</span>(<span class="str">"Circle area(5) = %.2f\n"</span>, <span class="fn">AREA</span>(r));              <span class="cm">// 78.54</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Compare preprocessor directives and compiler directives.',
        a:`<div class="tbl-wrap"><table><tr><th>Preprocessor Directives</th><th>Compiler Directives (pragma)</th></tr>
        <tr><td>Handled by preprocessor before compilation</td><td>Handled by compiler during compilation</td></tr>
        <tr><td>#include, #define, #ifdef</td><td>#pragma once, #pragma pack, etc.</td></tr>
        <tr><td>Portable across compilers</td><td>Compiler-specific (may not be portable)</td></tr>
        <tr><td>Text substitution / file inclusion</td><td>Control compiler behavior</td></tr>
        <tr><td>Always start with #</td><td>Always start with #pragma</td></tr>
        </table></div>
        <div class="ib tip"><strong>#pragma once</strong>Modern alternative to header guards. Tells compiler to include the file only once per compilation unit.</div>`},
      { q:'Write a program demonstrating command-line arguments.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>cmdargs.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;stdlib.h&gt;</span>
<span class="hd">#include &lt;string.h&gt;</span>

<span class="kw">int</span> <span class="fn">main</span>(<span class="kw">int</span> argc, <span class="kw">char</span> *argv[]) {
    <span class="fn">printf</span>(<span class="str">"Program: %s\n"</span>, argv[<span class="num">0</span>]);
    <span class="fn">printf</span>(<span class="str">"Number of arguments (excluding name): %d\n"</span>, argc-<span class="num">1</span>);

    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;argc; i++)
        <span class="fn">printf</span>(<span class="str">"argv[%d] = %s\n"</span>, i, argv[i]);

    <span class="cm">// Example: sum all numeric args</span>
    <span class="kw">int</span> sum = <span class="num">0</span>;
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;argc; i++)
        sum += <span class="fn">atoi</span>(argv[i]);  <span class="cm">// Convert string to int</span>
    <span class="fn">printf</span>(<span class="str">"Sum of all arguments = %d\n"</span>, sum);

    <span class="kw">return</span> <span class="num">0</span>;
}
<span class="cm">// Compile: gcc cmdargs.c -o cmdargs
// Run:     ./cmdargs 10 20 30 40
// Output:  Sum of all arguments = 100</span></pre></div>`},
      { q:'Explain the complete preprocessing phase in C program compilation.',
        a:`<p>The preprocessing phase runs <strong>before</strong> actual compilation. The preprocessor processes all lines starting with <code>#</code>:</p>
        <h4>Step 1 — Trigraph Replacement</h4>
        <p>Replaces trigraph sequences (??=, ??/, etc.) with their equivalents.</p>
        <h4>Step 2 — Line Splicing</h4>
        <p>Lines ending with <code>\</code> are joined with the next line.</p>
        <h4>Step 3 — Tokenization</h4>
        <p>Source is split into preprocessing tokens.</p>
        <h4>Step 4 — Directive Processing</h4>
        <ul>
        <li><code>#include</code> — file content is inserted at that point</li>
        <li><code>#define</code> — macro definition stored in macro table</li>
        <li><code>#ifdef/#ifndef</code> — sections included or excluded</li>
        <li><code>#undef</code> — macro removed from table</li>
        </ul>
        <h4>Step 5 — Macro Expansion</h4>
        <p>All macro identifiers in code replaced by their definitions. This is pure text substitution.</p>
        <h4>Step 6 — Output</h4>
        <p>Preprocessed source (no # directives, all macros expanded) passed to the compiler.</p>
        <div class="ib imp"><strong>View Preprocessed Output</strong>Run: <code>gcc -E program.c -o program.i</code> to see preprocessed file.</div>`},
    ]},
  ]
},
];

// ══════════════════════════════════════
// BUILD NAV & SECTIONS
// ══════════════════════════════════════
function buildNav() {
  const sidebar = document.getElementById('desktopSidebar');
  const drawerNav = document.getElementById('drawerNav');
  let sidebarHTML = '<div class="sb-title">All Units</div>';
  let drawerHTML = '';

  units.forEach(unit => {
    const unitLabel = `<div class="sb-unit">${unit.title.substring(0,22)}…</div>`;
    sidebarHTML += unitLabel;
    drawerHTML += `<div class="sb-unit" style="padding:10px 18px 4px;font-size:10px;font-weight:700;color:var(--accent3);letter-spacing:1.5px;text-transform:uppercase;">${unit.short}</div>`;
    unit.groups.forEach(g => {
      const id = unit.id + '_g' + g.label.toLowerCase();
      const label = `Group ${g.label} (${g.marks} marks)`;
      sidebarHTML += `<div class="sb-item" id="sb-${id}" onclick="show('${id}')"><span class="grp">${g.label}</span>${label}</div>`;
      drawerHTML += `<div class="sb-item" id="dr-${id}" onclick="show('${id}',true)"><span class="grp">${g.label}</span>${label}</div>`;
    });
  });

  sidebar.innerHTML = sidebarHTML;
  drawerNav.innerHTML = drawerHTML;
}

function buildSections() {
  const main = document.getElementById('mainContent');
  let html = '';

  units.forEach((unit, ui) => {
    unit.groups.forEach((g, gi) => {
      const id = unit.id + '_g' + g.label.toLowerCase();
      const groupClass = g.label === 'A' ? 'a' : g.label === 'B' ? 'b' : 'c';
      const colors = { A: 'var(--accent4)', B: 'var(--accent3)', C: 'var(--accent2)' };

      let qHtml = '';
      g.qs.forEach((q, qi) => {
        qHtml += `
          <div class="qa group-${g.label.toLowerCase()}" id="qa-${id}-${qi}">
            <div class="qa-q" onclick="toggleQ('qa-${id}-${qi}')">
              <div class="q-num">Q${qi+1}</div>
              <div class="q-text">${q.q}</div>
              <div class="q-arrow">▾</div>
            </div>
            <div class="qa-a">${q.a}</div>
          </div>`;
      });

      // Nav buttons
      let prevId = '', nextId = '';
      const allSections = [];
      units.forEach(u => u.groups.forEach(gg => allSections.push(u.id + '_g' + gg.label.toLowerCase())));
      const curIdx = allSections.indexOf(id);
      if (curIdx > 0) prevId = allSections[curIdx - 1];
      if (curIdx < allSections.length - 1) nextId = allSections[curIdx + 1];

      html += `
        <div class="section${ui === 0 && gi === 0 ? ' active' : ''}" id="sec-${id}">
          <div class="page-header">
            <div class="page-tag">${unit.short}</div>
            <h2>${unit.title}</h2>
            <p style="color:var(--muted);font-size:13px;">${unit.id.replace('u','Unit ')} — Group ${g.label} Questions (${g.marks} marks each) — ${g.qs.length} questions</p>
          </div>
          <div class="group-label ${groupClass}">
            ${g.label === 'A' ? '📝' : g.label === 'B' ? '⚡' : '🔥'} Group ${g.label} — ${g.marks} Marks Each
          </div>
          ${qHtml}
          <div class="lesson-nav">
            <div class="nav-prog"><span>${curIdx + 1}</span> / ${allSections.length}</div>
            ${prevId ? `<button class="lnb prev" onclick="show('${prevId}')"><span>←</span><div><span class="lbl">Previous</span><span class="ttl">${prevId.replace('u','U').replace('_ga',' · Grp A').replace('_gb',' · Grp B').replace('_gc',' · Grp C')}</span></div></button>` : '<div style="flex:1;max-width:220px;"></div>'}
            ${nextId ? `<button class="lnb next" onclick="show('${nextId}')"><div style="text-align:right;"><span class="lbl">Next</span><span class="ttl">${nextId.replace('u','U').replace('_ga',' · Grp A').replace('_gb',' · Grp B').replace('_gc',' · Grp C')}</span></div><span>→</span></button>` : '<div style="flex:1;max-width:220px;"></div>'}
          </div>
        </div>`;
    });
  });

  main.innerHTML = html;
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function show(id, fromDrawer = false) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(n => n.classList.remove('active'));
  const sec = document.getElementById('sec-' + id);
  if (sec) sec.classList.add('active');
  const sbItem = document.getElementById('sb-' + id);
  if (sbItem) sbItem.classList.add('active');
  const drItem = document.getElementById('dr-' + id);
  if (drItem) drItem.classList.add('active');
  if (fromDrawer) closeDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleQ(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function openDrawer() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow = '';
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
buildNav();
buildSections();
// Set first item active in sidebar
document.querySelector('.sb-item').classList.add('active');
</script>
</body>
</html>
