<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIT412 C Programming — Complete Q&A Answer Bank</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --surface: #0f1724;
  --surface2: #162032;
  --surface3: #1c2840;
  --accent: #00e5b8;
  --accent2: #ff6b35;
  --accent3: #a78bfa;
  --accent4: #38bdf8;
  --text: #dde6f0;
  --muted: #5a7080;
  --code-bg: #060a10;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --border: #1a2535;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Sora',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#080c14 0%,#130824 50%,#080c14 100%);
  border-bottom:1px solid var(--border);
  padding:20px 28px;
  position:sticky;top:0;z-index:200;
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:14px;}
.logo-icon{
  width:46px;height:46px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:#000;
  flex-shrink:0;
}
.logo h1{font-size:18px;font-weight:700;color:var(--accent);line-height:1.2;}
.logo p{font-size:12px;color:var(--muted);margin-top:2px;}
.header-badge{
  background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(255,107,53,.05));
  border:1px solid rgba(255,107,53,.4);
  border-radius:10px;padding:8px 16px;
  font-size:12px;font-weight:600;color:var(--accent2);
  font-family:'JetBrains Mono',monospace;
}
.mobile-menu-btn{
  display:none;
  background:none;border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;cursor:pointer;color:var(--text);font-size:13px;
  font-family:'Sora',sans-serif;transition:all .2s;
}
.mobile-menu-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 81px);}

/* ── SIDEBAR ── */
.sidebar{
  width:270px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky;top:81px;
  height:calc(100vh - 81px);
  overflow-y:auto;padding:16px 0;
}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:#1e3040;border-radius:99px;}
.sb-title{
  font-size:10px;font-weight:700;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  padding:0 18px 10px;
}
.sb-unit{
  padding:6px 18px 4px;
  font-size:10px;font-weight:700;color:var(--accent3);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-top:8px;
}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 18px;cursor:pointer;
  border-left:3px solid transparent;
  transition:all .2s;font-size:13px;color:var(--muted);
}
.sb-item:hover{background:var(--surface2);color:var(--text);}
.sb-item.active{
  background:rgba(0,229,184,.08);
  border-left-color:var(--accent);color:var(--accent);
}
.sb-item .grp{
  font-size:10px;font-family:'JetBrains Mono',monospace;
  background:var(--surface3);border-radius:4px;
  padding:1px 5px;min-width:22px;text-align:center;
  color:var(--muted);flex-shrink:0;
}
.sb-item.active .grp{background:rgba(0,229,184,.2);color:var(--accent);}

/* ── MAIN ── */
.main{flex:1;padding:36px 32px;max-width:900px;}

.section{display:none;}
.section.active{display:block;}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:36px;}
.page-tag{
  display:inline-block;
  background:rgba(0,229,184,.12);color:var(--accent);
  border:1px solid rgba(0,229,184,.25);
  border-radius:6px;padding:4px 12px;
  font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:12px;
}
.page-header h2{font-size:28px;font-weight:700;line-height:1.25;margin-bottom:8px;}
.page-header p{color:var(--muted);font-size:14px;line-height:1.7;}

/* ── GROUP BADGE ── */
.group-label{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:8px;
  font-size:12px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  margin:28px 0 16px;
}
.group-label.a{background:rgba(56,189,248,.1);color:var(--accent4);border:1px solid rgba(56,189,248,.25);}
.group-label.b{background:rgba(167,139,250,.1);color:var(--accent3);border:1px solid rgba(167,139,250,.25);}
.group-label.c{background:rgba(255,107,53,.1);color:var(--accent2);border:1px solid rgba(255,107,53,.25);}

/* ── Q&A CARD ── */
.qa{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:18px;
  overflow:hidden;
  transition:border-color .2s;
}
.qa:hover{border-color:var(--surface3);}
.qa-q{
  display:flex;align-items:flex-start;gap:14px;
  padding:18px 20px;cursor:pointer;
  border-bottom:1px solid transparent;
  transition:all .2s;
}
.qa-q:hover{background:var(--surface2);}
.qa.open .qa-q{
  border-bottom-color:var(--border);
  background:var(--surface2);
}
.q-num{
  flex-shrink:0;width:28px;height:28px;
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
  margin-top:1px;
}
.group-a .q-num{background:rgba(56,189,248,.15);color:var(--accent4);}
.group-b .q-num{background:rgba(167,139,250,.15);color:var(--accent3);}
.group-c .q-num{background:rgba(255,107,53,.15);color:var(--accent2);}
.q-text{flex:1;font-size:14px;font-weight:600;line-height:1.55;color:var(--text);}
.q-arrow{
  flex-shrink:0;font-size:16px;color:var(--muted);
  transition:transform .3s;margin-top:2px;
}
.qa.open .q-arrow{transform:rotate(180deg);}

.qa-a{
  display:none;padding:20px 22px;
  border-top:1px solid var(--border);
}
.qa.open .qa-a{display:block;}
.qa-a p,.qa-a li{
  font-size:14px;line-height:1.85;color:#94a3b8;
}
.qa-a ul,.qa-a ol{padding-left:22px;margin:8px 0;}
.qa-a li{margin-bottom:5px;}
.qa-a h4{
  font-size:13px;font-weight:700;color:var(--accent);
  margin:14px 0 6px;text-transform:uppercase;letter-spacing:.8px;
}
.qa-a strong{color:var(--text);}

/* ── CODE ── */
.cb{
  background:var(--code-bg);border:1px solid #1a2535;
  border-radius:10px;margin:14px 0;overflow:hidden;
}
.cb-header{
  background:#0d1520;padding:7px 14px;
  display:flex;align-items:center;gap:7px;
  border-bottom:1px solid #1a2535;
}
.cb-header span{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.dot{width:9px;height:9px;border-radius:50%;}
.dot.r{background:#ff5f56;} .dot.y{background:#ffbd2e;} .dot.g{background:#27c93f;}
.cb pre{
  padding:16px;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;line-height:1.8;overflow-x:auto;color:#e6edf3;
}
.kw{color:#ff7b72;} .fn{color:#d2a8ff;} .str{color:#a5d6ff;}
.cm{color:#7a8ea0;font-style:italic;} .num{color:#79c0ff;}
.hd{color:#ffa657;} .tp{color:#79c0ff;}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;margin:12px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--surface3);padding:9px 13px;text-align:left;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border);}
td{padding:9px 13px;border-bottom:1px solid var(--border);color:#94a3b8;font-family:'JetBrains Mono',monospace;font-size:12px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}

/* ── INFO BOX ── */
.ib{border-radius:10px;padding:13px 16px;margin:12px 0;font-size:13px;line-height:1.7;}
.ib strong{display:block;margin-bottom:5px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;}
.ib.tip{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;}
.ib.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d;}
.ib.imp{background:rgba(0,229,184,.1);border:1px solid rgba(0,229,184,.3);color:#6ee7d4;}

/* ── NAV ── */
.lesson-nav{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:40px;padding-top:20px;
  border-top:1px solid var(--border);flex-wrap:wrap;
}
.lnb{
  display:flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);cursor:pointer;font-family:'Sora',sans-serif;
  font-size:13px;font-weight:500;transition:all .2s;flex:1;max-width:220px;
}
.lnb:hover{border-color:var(--accent);background:rgba(0,229,184,.07);color:var(--accent);}
.lnb.next{justify-content:flex-end;margin-left:auto;}
.lnb .lbl{font-size:10px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:1px;margin-bottom:1px;}
.lnb .ttl{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.nav-prog{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;}
.nav-prog span{color:var(--accent);}

/* ── OVERLAY/DRAWER (mobile) ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;backdrop-filter:blur(4px);}
.overlay.open{display:block;}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:280px;
  background:var(--surface);border-right:1px solid var(--border);
  padding:16px 0;z-index:301;
  transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto;
}
.drawer.open{transform:translateX(0);}
.drawer-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.drawer-close:hover{color:var(--text);}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{display:none;}
  .mobile-menu-btn{display:block;}
  .main{padding:18px 14px;}
  .page-header h2{font-size:20px;}
  .cb pre{font-size:11px;padding:12px;}
  table{min-width:360px;}
  .lnb{max-width:100%;}
}
@media(max-width:480px){
  .lesson-nav{flex-direction:column;}
  .lnb{max-width:100%;width:100%;}
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#1e3040;border-radius:99px;}
</style>
</head>
<body>

<!-- Mobile overlay + drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div style="padding:40px 0 8px 18px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;">Topics</div>
  <div id="drawerNav"></div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">C</div>
    <div>
      <h1>BIT412 — C Programming</h1>
      <p>Complete Q&amp;A Answer Bank · All 9 Units · Group A / B / C</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="mobile-menu-btn" onclick="openDrawer()">☰ Units</button>
    <div class="header-badge">90%+ EXAM PREP</div>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="desktopSidebar"></nav>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent"></main>
</div>

<script>
// ══════════════════════════════════════
// DATA — all 9 units, all Q&A
// ══════════════════════════════════════
const units = [
{
  id:'u1', title:'Introduction to Programming & Problem Solving', short:'Intro & Problem Solving',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define algorithm with an example.',
        a:`<p>An <strong>algorithm</strong> is a finite, ordered set of well-defined instructions designed to solve a specific problem or perform a task.</p>
        <h4>Example — Find area of a rectangle</h4>
        <p>Step 1: Start<br>Step 2: Input length (l) and breadth (b)<br>Step 3: area = l × b<br>Step 4: Print area<br>Step 5: Stop</p>
        <div class="ib imp"><strong>Key Properties</strong> Finite (must end), Definite (each step is clear), Input (0 or more), Output (1 or more), Effective (each step is feasible).</div>`},
      { q:'Differentiate between compiler and interpreter.',
        a:`<div class="tbl-wrap"><table><tr><th>Compiler</th><th>Interpreter</th></tr>
        <tr><td>Translates entire program at once</td><td>Translates line by line</td></tr>
        <tr><td>Faster execution after compilation</td><td>Slower execution</td></tr>
        <tr><td>Errors shown after full scan</td><td>Errors shown immediately</td></tr>
        <tr><td>Generates object code (.o/.exe)</td><td>No object code generated</td></tr>
        <tr><td>Example: GCC (C compiler)</td><td>Example: Python interpreter</td></tr>
        </table></div>`},
      { q:'List any three characteristics of a good program.',
        a:`<ul>
        <li><strong>Reliability</strong> — Produces correct output for all valid inputs.</li>
        <li><strong>Readability</strong> — Code is easy to understand and maintain with proper naming and comments.</li>
        <li><strong>Efficiency</strong> — Uses minimum memory and execution time.</li>
        <li><strong>Portability</strong> — Can run on different hardware/OS platforms.</li>
        <li><strong>Maintainability</strong> — Easy to modify, update, or extend.</li>
        </ul>`},
      { q:'What is a flowchart? Mention two advantages.',
        a:`<p>A <strong>flowchart</strong> is a diagrammatic representation of an algorithm using standardized symbols to show the sequence of steps in a process or program.</p>
        <h4>Common Symbols</h4>
        <div class="tbl-wrap"><table><tr><th>Symbol</th><th>Shape</th><th>Meaning</th></tr>
        <tr><td>Oval</td><td>Ellipse</td><td>Start / Stop (Terminal)</td></tr>
        <tr><td>Rectangle</td><td>Box</td><td>Process / Calculation</td></tr>
        <tr><td>Diamond</td><td>Rhombus</td><td>Decision (Yes/No)</td></tr>
        <tr><td>Parallelogram</td><td>Slanted box</td><td>Input / Output</td></tr>
        <tr><td>Arrow</td><td>Line with arrowhead</td><td>Flow direction</td></tr>
        </table></div>
        <h4>Two Advantages</h4>
        <ul><li>Makes logic easy to visualize and understand before writing code.</li>
        <li>Helps in debugging by clearly showing the program's decision flow.</li></ul>`},
      { q:'Explain the program development life cycle (PDLC).',
        a:`<p>The PDLC is a structured approach to software development with 6 phases:</p>
        <ol>
        <li><strong>Problem Definition</strong> — Understand and clearly state the problem.</li>
        <li><strong>Problem Analysis</strong> — Identify inputs, outputs, and constraints.</li>
        <li><strong>Algorithm Design</strong> — Write step-by-step solution logic (pseudocode/flowchart).</li>
        <li><strong>Coding</strong> — Convert algorithm into a programming language (C).</li>
        <li><strong>Testing &amp; Debugging</strong> — Run the program, find and fix errors.</li>
        <li><strong>Documentation &amp; Maintenance</strong> — Write manuals; update as requirements change.</li>
        </ol>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Draw a flowchart to find the largest among two numbers.',
        a:`<h4>Algorithm</h4>
        <ol>
        <li>Start</li><li>Input A and B</li>
        <li>If A &gt; B then print "A is largest", else print "B is largest"</li>
        <li>Stop</li></ol>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>flowchart logic (text form)</span></div><pre>        [START]
           |
    [Input A and B]
           |
      Is A > B?
     /         \
   YES           NO
    |              |
 Print A        Print B
    \            /
       [STOP]</pre></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>largest.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a, b;
    <span class="fn">printf</span>(<span class="str">"Enter two numbers: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;a, &amp;b);
    <span class="kw">if</span> (a &gt; b)
        <span class="fn">printf</span>(<span class="str">"Largest = %d\n"</span>, a);
    <span class="kw">else</span>
        <span class="fn">printf</span>(<span class="str">"Largest = %d\n"</span>, b);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Compare machine language, assembly language, and high-level language.',
        a:`<div class="tbl-wrap"><table><tr><th>Feature</th><th>Machine Language</th><th>Assembly Language</th><th>High-Level Language</th></tr>
        <tr><td>Form</td><td>Binary (0s and 1s)</td><td>Mnemonics (ADD, MOV)</td><td>English-like (C, Python)</td></tr>
        <tr><td>Readability</td><td>Very difficult</td><td>Difficult</td><td>Easy</td></tr>
        <tr><td>Speed</td><td>Fastest</td><td>Fast</td><td>Slower</td></tr>
        <tr><td>Portability</td><td>Not portable</td><td>Not portable</td><td>Portable</td></tr>
        <tr><td>Translator</td><td>None needed</td><td>Assembler</td><td>Compiler / Interpreter</td></tr>
        <tr><td>Example</td><td>10110000</td><td>MOV AX, BX</td><td>a = b + c;</td></tr>
        </table></div>`},
      { q:'Analyze the steps involved in solving a programming problem.',
        a:`<ol>
        <li><strong>Understand the Problem</strong> — Read carefully; identify what is given and required.</li>
        <li><strong>Identify Inputs &amp; Outputs</strong> — e.g., input = two numbers, output = sum.</li>
        <li><strong>Design Algorithm</strong> — Write logical steps in plain language or pseudocode.</li>
        <li><strong>Draw Flowchart</strong> — Visualize the logic with standard symbols.</li>
        <li><strong>Write Code</strong> — Implement algorithm in C.</li>
        <li><strong>Compile &amp; Test</strong> — Check for syntax and logic errors.</li>
        <li><strong>Debug</strong> — Fix all errors found during testing.</li>
        <li><strong>Deploy &amp; Document</strong> — Finalize and add documentation.</li>
        </ol>`},
      { q:'Explain the role of a compiler during program execution.',
        a:`<p>A compiler performs these sequential phases:</p>
        <ol>
        <li><strong>Lexical Analysis</strong> — Breaks source code into tokens (keywords, identifiers, operators).</li>
        <li><strong>Syntax Analysis (Parsing)</strong> — Checks if the token arrangement follows grammar rules.</li>
        <li><strong>Semantic Analysis</strong> — Checks meaning — e.g., type mismatch, undeclared variables.</li>
        <li><strong>Intermediate Code Generation</strong> — Produces platform-independent code.</li>
        <li><strong>Code Optimization</strong> — Improves efficiency of generated code (removes redundancy).</li>
        <li><strong>Code Generation</strong> — Produces machine code / object file (.o).</li>
        <li><strong>Error Reporting</strong> — Reports all errors found during any phase.</li>
        </ol>
        <p>After compilation, the <strong>Linker</strong> combines object files with libraries to produce the final executable.</p>`},
      { q:'Design an algorithm to calculate the area of a rectangle.',
        a:`<h4>Algorithm</h4>
        <ol>
        <li>Start</li><li>Input length (l) and breadth (b)</li>
        <li>area = l × b</li><li>perimeter = 2 × (l + b)</li>
        <li>Print area and perimeter</li><li>Stop</li>
        </ol>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>rectangle.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">float</span> l, b, area, perimeter;
    <span class="fn">printf</span>(<span class="str">"Enter length and breadth: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%f %f"</span>, &amp;l, &amp;b);
    area = l * b;
    perimeter = <span class="num">2</span> * (l + b);
    <span class="fn">printf</span>(<span class="str">"Area      = %.2f\n"</span>, area);
    <span class="fn">printf</span>(<span class="str">"Perimeter = %.2f\n"</span>, perimeter);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Explain the phases of problem-solving and program development with examples.',
        a:`<h4>Phase 1 — Problem Definition</h4>
        <p>Clearly state what needs to be solved. Example: "Find sum of two numbers entered by user."</p>
        <h4>Phase 2 — Problem Analysis</h4>
        <p>Input: two integers a, b &nbsp;|&nbsp; Output: sum = a + b &nbsp;|&nbsp; Constraints: integers only</p>
        <h4>Phase 3 — Algorithm Design</h4>
        <ol><li>Start</li><li>Input a, b</li><li>sum = a + b</li><li>Print sum</li><li>Stop</li></ol>
        <h4>Phase 4 — Coding</h4>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>sum.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {

        <h4>Phase 5 — Testing &amp; Debugging</h4>
        <p>Run with test inputs: 5 and 3 → expected output: 8. Fix any errors found.</p>
        <h4>Phase 6 — Documentation</h4>
        <p>Write comments in code, prepare user manuals, and note maintenance guidelines.</p>`},

Print "Even"   Print "Odd"

      { q:'Compare different generations of programming languages.',
        a:`<div class="tbl-wrap"><table><tr><th>Generation</th><th>Name</th><th>Features</th><th>Example</th></tr>
        <tr><td>1GL</td><td>Machine Language</td><td>Binary code, fastest, directly executed by CPU</td><td>1011 0000 0110</td></tr>
        <tr><td>2GL</td><td>Assembly Language</td><td>Mnemonics, needs assembler to convert</td><td>MOV AX, 01H</td></tr>
        <tr><td>3GL</td><td>High-Level Language</td><td>English-like, portable, needs compiler</td><td>C, FORTRAN, COBOL</td></tr>
        <tr><td>4GL</td><td>Very High-Level</td><td>Closer to human language, less code</td><td>SQL, MATLAB</td></tr>

      { q:'Develop an algorithm and flowchart to find the sum of first N natural numbers.',
        a:`<h4>Algorithm</h4>
        <ol><li>Start</li><li>Input N</li><li>Set sum = 0, i = 1</li>
        <li>While i ≤ N: sum = sum + i; i = i + 1</li><li>Print sum</li><li>Stop</li></ol>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>sum_natural.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

        sum += i;

      { q:'Explain the complete structure of a C program with a suitable example.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>complete_structure.c</span></div><pre><span class="cm">// 1. Preprocessor Directives</span>
<span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;math.h&gt;</span>
<span class="hd">#define PI 3.14</span>

<span class="cm">// 2. Global Variable Declaration</span>
<span class="kw">int</span> globalVar = <span class="num">10</span>;

<span class="cm">// 3. Function Prototype (Declaration)</span>
<span class="kw">void</span> <span class="fn">greet</span>();

<span class="cm">// 4. Main Function — execution starts here</span>
<span class="kw">int</span> <span class="fn">main</span>() {

    <span class="cm">// 5. Local Variable Declaration</span>
    <span class="kw">int</span> a = <span class="num">5</span>, b = <span class="num">3</span>, sum;

    <span class="cm">// 6. Statements and Expressions</span>
    sum = a + b;

    <span class="cm">// 7. Input / Output</span>

}

<span class="cm">// 10. User-Defined Function Definition</span>

}</pre></div>
        <div class="tbl-wrap"><table><tr><th>Part</th><th>Purpose</th></tr>

        <tr><td>Local variables</td><td>Declared inside a function; limited scope</td></tr>

},
{
  id:'u2', title:'Data Types, Variables, Operators and I/O', short:'Data Types & Operators',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define variable and constant.',
        a:`<p><strong>Variable:</strong> A named memory location that stores a value which can change during program execution.<br>Example: <code>int age = 20;</code> — age can be changed later.</p>
        <p><strong>Constant:</strong> A named memory location whose value cannot be changed once assigned.<br>Example: <code>const float PI = 3.14;</code> — PI cannot be reassigned.</p>
        <div class="ib imp"><strong>Difference</strong>Variables are mutable; constants are immutable. Use <code>const</code> keyword or <code>#define</code> for constants.</div>`},
      { q:'What are primitive data types in C?',
        a:`<p>Primitive (fundamental) data types are the basic built-in types provided by C:</p>
        <div class="tbl-wrap"><table><tr><th>Type</th><th>Size</th><th>Range</th><th>Example</th></tr>
        <tr><td>int</td><td>2/4 bytes</td><td>-32768 to 32767</td><td>int x = 5;</td></tr>
        <tr><td>float</td><td>4 bytes</td><td>3.4e-38 to 3.4e+38</td><td>float gpa = 3.8;</td></tr>
        <tr><td>double</td><td>8 bytes</td><td>±1.7×10^308</td><td>double pi = 3.14;</td></tr>
        <tr><td>char</td><td>1 byte</td><td>-128 to 127</td><td>char g = 'A';</td></tr>
        <tr><td>void</td><td>0</td><td>No value</td><td>void main()</td></tr>
        </table></div>`},
      { q:'Differentiate between scanf() and printf().',
        a:`<div class="tbl-wrap"><table><tr><th>scanf()</th><th>printf()</th></tr>
        <tr><td>Used for input (reading data)</td><td>Used for output (displaying data)</td></tr>
        <tr><td>Requires &amp; (address-of) operator for non-array variables</td><td>Does not require &amp; operator</td></tr>
        <tr><td>scanf("%d", &amp;n);</td><td>printf("%d", n);</td></tr>
        <tr><td>Returns number of items read</td><td>Returns number of characters printed</td></tr>
        </table></div>`},
      { q:'What is type conversion?',
        a:`<p><strong>Type Conversion</strong> is the process of converting a value from one data type to another.</p>
        <p><strong>Implicit (Automatic):</strong> Done automatically by the compiler. Smaller type → larger type (no data loss).<br>Example: <code>int a = 5; float b = a;</code> → b = 5.0</p>
        <p><strong>Explicit (Type Casting):</strong> Done manually by the programmer using cast operator.<br>Example: <code>float x = 9.7; int y = (int)x;</code> → y = 9 (decimal truncated)</p>`},
      { q:'Define identifier and mention naming rules.',
        a:`<p>An <strong>identifier</strong> is a name given to a variable, function, array, or other user-defined entity in C.</p>
        <h4>Naming Rules</h4>
        <ul>
        <li>✔ Must start with a letter (a-z, A-Z) or underscore (_)</li>
        <li>✔ Can contain letters, digits (0-9), and underscores</li>
        <li>✘ Cannot start with a digit (e.g., <code>2marks</code> is INVALID)</li>
        <li>✘ Cannot use reserved keywords (e.g., int, float, for)</li>
        <li>✘ Cannot contain spaces or special characters</li>
        <li>✔ C is case-sensitive: <code>Age</code> ≠ <code>age</code></li>
        </ul>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Predict the output: int a=10, b=3; printf("%d", a%b);',
        a:`<h4>Step-by-Step Trace</h4>
        <p>a = 10, b = 3</p>
        <p>a % b = 10 % 3 = <strong>1</strong> (remainder when 10 is divided by 3)</p>
        <div class="ib imp"><strong>Output</strong> 1</div>
        <p>The modulus operator <code>%</code> returns the <strong>remainder</strong> of integer division. 10 ÷ 3 = 3 remainder 1, so result is 1.</p>`},
      { q:'Explain operator precedence with examples.',
        a:`<p>Operator precedence determines the order in which operators are evaluated in an expression. Higher precedence operators execute first.</p>
        <div class="tbl-wrap"><table><tr><th>Precedence</th><th>Operators</th><th>Associativity</th></tr>
        <tr><td>Highest</td><td>() [] .</td><td>Left to Right</td></tr>
        <tr><td>2</td><td>++ -- ! ~ (unary)</td><td>Right to Left</td></tr>
        <tr><td>3</td><td>* / %</td><td>Left to Right</td></tr>
        <tr><td>4</td><td>+ -</td><td>Left to Right</td></tr>
        <tr><td>5</td><td>&lt; &lt;= &gt; &gt;=</td><td>Left to Right</td></tr>
        <tr><td>6</td><td>== !=</td><td>Left to Right</td></tr>
        <tr><td>7</td><td>&amp;&amp;</td><td>Left to Right</td></tr>
        <tr><td>8</td><td>||</td><td>Left to Right</td></tr>
        <tr><td>Lowest</td><td>= += -= etc.</td><td>Right to Left</td></tr>
        </table></div>
        <p><strong>Example:</strong> <code>int x = 2 + 3 * 4;</code><br>* has higher precedence than +, so: 3*4=12 first, then 2+12 = <strong>14</strong></p>`},
      { q:'Analyze implicit and explicit type conversion.',
        a:`<h4>Implicit Conversion (Type Promotion)</h4>
        <p>Automatically performed by the compiler when mixing types. Always converts to the larger/wider type to avoid data loss.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>implicit.c</span></div><pre><span class="kw">int</span> a = <span class="num">5</span>;
<span class="kw">float</span> b = a;         <span class="cm">// int → float automatically: b = 5.0</span>
<span class="kw">double</span> c = a + b;    <span class="cm">// int+float → double automatically</span></pre></div>
        <h4>Explicit Conversion (Type Casting)</h4>
        <p>Programmer forces conversion using cast operator <code>(type)</code>. May cause data loss.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>explicit.c</span></div><pre><span class="kw">float</span> x = <span class="num">9.7</span>;
<span class="kw">int</span> y = (<span class="kw">int</span>)x;    <span class="cm">// Explicitly cast: y = 9 (0.7 truncated!)</span>

<span class="kw">int</span> p = <span class="num">7</span>, q = <span class="num">2</span>;
<span class="kw">float</span> result = (<span class="kw">float</span>)p / q;  <span class="cm">// result = 3.5 (not 3)</span></pre></div>`},
      { q:'Differentiate arithmetic, relational, and logical operators.',
        a:`<div class="tbl-wrap"><table><tr><th>Type</th><th>Operators</th><th>Purpose</th><th>Example</th></tr>
        <tr><td>Arithmetic</td><td>+ - * / %</td><td>Mathematical calculations</td><td>a + b = 8</td></tr>
        <tr><td>Relational</td><td>== != &lt; &gt; &lt;= &gt;=</td><td>Compare two values; returns 0 or 1</td><td>a &gt; b → 1 (true)</td></tr>
        <tr><td>Logical</td><td>&amp;&amp; || !</td><td>Combine conditions</td><td>a&gt;0 &amp;&amp; b&gt;0</td></tr>
        </table></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>operators.c</span></div><pre><span class="kw">int</span> a=<span class="num">5</span>, b=<span class="num">3</span>;
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, a + b);       <span class="cm">// Arithmetic: 8</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, a &gt; b);       <span class="cm">// Relational: 1 (true)</span>
<span class="fn">printf</span>(<span class="str">"%d\n"</span>, a&gt;<span class="num">0</span> &amp;&amp; b&gt;<span class="num">0</span>); <span class="cm">// Logical: 1 (both true)</span></pre></div>`},
      { q:'Explain formatted input and output functions.',
        a:`<h4>printf() — Formatted Output</h4>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>printf.c</span></div><pre><span class="fn">printf</span>(<span class="str">"Name: %s, Age: %d\n"</span>, name, age);
<span class="fn">printf</span>(<span class="str">"Marks: %.2f\n"</span>, marks);   <span class="cm">// .2f = 2 decimal places</span>
<span class="fn">printf</span>(<span class="str">"%10d\n"</span>, num);            <span class="cm">// Right-aligned, width 10</span>
<span class="fn">printf</span>(<span class="str">"%-10d\n"</span>, num);           <span class="cm">// Left-aligned, width 10</span></pre></div>
        <h4>scanf() — Formatted Input</h4>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>scanf.c</span></div><pre><span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;age);        <span class="cm">// &amp; is MANDATORY!</span>
<span class="fn">scanf</span>(<span class="str">"%f"</span>, &amp;marks);
<span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;a, &amp;b);  <span class="cm">// Multiple inputs</span>
<span class="fn">scanf</span>(<span class="str">"%s"</span>, name);         <span class="cm">// String (no &amp; needed)</span></pre></div>
        <div class="tbl-wrap"><table><tr><th>Specifier</th><th>Type</th></tr>
        <tr><td>%d</td><td>int</td></tr><tr><td>%f</td><td>float</td></tr>
        <tr><td>%lf</td><td>double</td></tr><tr><td>%c</td><td>char</td></tr>
        <tr><td>%s</td><td>string</td></tr><tr><td>%p</td><td>pointer address</td></tr>
        </table></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Discuss all fundamental data types in C with memory requirements.',
        a:`<div class="tbl-wrap"><table><tr><th>Data Type</th><th>Size</th><th>Range</th><th>Format</th><th>Example</th></tr>
        <tr><td>int</td><td>2/4 bytes</td><td>-32768 to 32767</td><td>%d</td><td>int age = 20;</td></tr>
        <tr><td>short int</td><td>2 bytes</td><td>-32768 to 32767</td><td>%hd</td><td>short x = 100;</td></tr>
        <tr><td>long int</td><td>4/8 bytes</td><td>±2 billion</td><td>%ld</td><td>long pop = 1000000;</td></tr>
        <tr><td>unsigned int</td><td>2/4 bytes</td><td>0 to 65535</td><td>%u</td><td>unsigned int n;</td></tr>
        <tr><td>float</td><td>4 bytes</td><td>3.4e-38 to 3.4e+38</td><td>%f</td><td>float gpa = 3.8;</td></tr>
        <tr><td>double</td><td>8 bytes</td><td>1.7e-308 to 1.7e+308</td><td>%lf</td><td>double pi = 3.14159;</td></tr>
        <tr><td>long double</td><td>12/16 bytes</td><td>Greater range</td><td>%Lf</td><td>long double x;</td></tr>
        <tr><td>char</td><td>1 byte</td><td>-128 to 127</td><td>%c</td><td>char g = 'A';</td></tr>
        <tr><td>unsigned char</td><td>1 byte</td><td>0 to 255</td><td>%c</td><td>unsigned char u;</td></tr>
        <tr><td>void</td><td>0 bytes</td><td>No value</td><td>—</td><td>void function();</td></tr>
        </table></div>`},
      { q:'Explain various categories of operators with examples.',
        a:`<h4>1. Arithmetic Operators</h4>
        <p>+, -, *, /, % — for math calculations. Example: 10%3 = 1</p>
        <h4>2. Relational Operators</h4>
        <p>==, !=, &lt;, &gt;, &lt;=, &gt;= — compare values, return 0 or 1</p>
        <h4>3. Logical Operators</h4>
        <p>&amp;&amp; (AND), || (OR), ! (NOT) — combine boolean conditions</p>
        <h4>4. Assignment Operators</h4>
        <p>=, +=, -=, *=, /=, %= — assign values. Example: a+=5 means a=a+5</p>
        <h4>5. Increment/Decrement</h4>
        <p>++ (increment), -- (decrement). Pre (++a) vs Post (a++)</p>
        <h4>6. Bitwise Operators</h4>
        <p>&amp; (AND), | (OR), ^ (XOR), ~ (NOT), &lt;&lt; (left shift), &gt;&gt; (right shift)</p>
        <h4>7. Ternary Operator</h4>
        <p>condition ? value_if_true : value_if_false<br>Example: max = (a&gt;b) ? a : b;</p>
        <h4>8. sizeof Operator</h4>
        <p>Returns size in bytes. Example: sizeof(int) = 4</p>`},
      { q:'Write a program to calculate simple and compound interest.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>interest.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;math.h&gt;</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">float</span> p, r, t, si, ci, amount;

    <span class="fn">printf</span>(<span class="str">"Enter Principal, Rate, Time: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%f %f %f"</span>, &amp;p, &amp;r, &amp;t);

    <span class="cm">// Simple Interest</span>
    si = (p * r * t) / <span class="num">100</span>;
    <span class="fn">printf</span>(<span class="str">"Simple Interest   = %.2f\n"</span>, si);

    <span class="cm">// Compound Interest: A = P*(1 + r/100)^t</span>
    amount = p * <span class="fn">pow</span>(<span class="num">1</span> + r/<span class="num">100</span>, t);
    ci = amount - p;
    <span class="fn">printf</span>(<span class="str">"Compound Interest = %.2f\n"</span>, ci);
    <span class="fn">printf</span>(<span class="str">"Total Amount      = %.2f\n"</span>, amount);

    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <div class="ib imp"><strong>Note</strong>Compile with: <code>gcc interest.c -lm</code> (the -lm flag links the math library for pow()).</div>`},
      { q:'Analyze operator precedence and associativity using examples.',
        a:`<p><strong>Precedence</strong> — Which operator executes first (higher number = executes first).</p>
        <p><strong>Associativity</strong> — When operators have same precedence, which direction do we evaluate (left-to-right or right-to-left)?</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>precedence.c</span></div><pre><span class="kw">int</span> a = <span class="num">2</span> + <span class="num">3</span> * <span class="num">4</span>;      <span class="cm">// * before +: 2+(3*4) = 14</span>
<span class="kw">int</span> b = (<span class="num">2</span> + <span class="num">3</span>) * <span class="num">4</span>;   <span class="cm">// () first: 5*4 = 20</span>

<span class="kw">int</span> c = <span class="num">10</span> / <span class="num">2</span> * <span class="num">5</span>;    <span class="cm">// Same prec, left-to-right: (10/2)*5 = 25</span>
<span class="kw">int</span> d = <span class="num">2</span> + <span class="num">3</span> &gt; <span class="num">4</span>;    <span class="cm">// + before >: (2+3)>4 = 5>4 = 1 (true)</span>

<span class="kw">int</span> x = <span class="num">5</span>;
<span class="kw">int</span> y = x++;          <span class="cm">// Post-increment: y=5, then x=6</span>
<span class="kw">int</span> z = ++x;          <span class="cm">// Pre-increment: x=7, z=7</span></pre></div>`},
      { q:'Write a program to swap two numbers using and without using a third variable.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>swap.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a, b;
    <span class="fn">printf</span>(<span class="str">"Enter two numbers: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;a, &amp;b);

    <span class="cm">// Method 1: Using a third variable (temp)</span>
    <span class="kw">int</span> temp = a;
    a = b;
    b = temp;
    <span class="fn">printf</span>(<span class="str">"After swap (with temp): a=%d, b=%d\n"</span>, a, b);

    <span class="cm">// Reset</span>
    <span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;a, &amp;b);

    <span class="cm">// Method 2: Without third variable (arithmetic)</span>
    a = a + b;    <span class="cm">// a now holds sum</span>
    b = a - b;    <span class="cm">// b = sum - old_b = old_a</span>
    a = a - b;    <span class="cm">// a = sum - new_b = old_b</span>
    <span class="fn">printf</span>(<span class="str">"After swap (no temp):   a=%d, b=%d\n"</span>, a, b);

    <span class="cm">// Method 3: Using XOR (bitwise)</span>
    a = a ^ b;
    b = a ^ b;
    a = a ^ b;
    <span class="fn">printf</span>(<span class="str">"After swap (XOR):       a=%d, b=%d\n"</span>, a, b);

    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
  ]
},
{
  id:'u3', title:'Control Structures', short:'Control Structures',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'What is a decision-making statement?',
        a:`<p>A <strong>decision-making statement</strong> allows a program to choose between different paths of execution based on a condition (true or false).</p>
        <p>Types in C:</p>
        <ul><li><strong>if</strong> — executes a block when condition is true</li>
        <li><strong>if-else</strong> — chooses between two blocks</li>
        <li><strong>if-else if-else</strong> — chains multiple conditions</li>
        <li><strong>switch</strong> — selects one case from many based on value</li></ul>`},
      { q:'Differentiate while and do-while loop.',
        a:`<div class="tbl-wrap"><table><tr><th>while</th><th>do-while</th></tr>
        <tr><td>Condition checked BEFORE loop body</td><td>Condition checked AFTER loop body</td></tr>
        <tr><td>May execute 0 times if condition is false</td><td>Always executes at least ONCE</td></tr>
        <tr><td>Entry-controlled loop</td><td>Exit-controlled loop</td></tr>
        <tr><td>while(cond) { body }</td><td>do { body } while(cond);</td></tr>
        </table></div>
        <div class="ib tip"><strong>Use do-while for</strong>Menus, input validation — when you must run the body at least once regardless of condition.</div>`},
      { q:'Define nested loop.',
        a:`<p>A <strong>nested loop</strong> is a loop inside another loop. The inner loop completes all its iterations for each single iteration of the outer loop.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>nested.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">3</span>; i++) {        <span class="cm">// Outer: 3 times</span>
    <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">1</span>; j&lt;=<span class="num">3</span>; j++) {    <span class="cm">// Inner: 3 times per outer</span>
        <span class="fn">printf</span>(<span class="str">"(%d,%d) "</span>, i, j);
    }
    <span class="fn">printf</span>(<span class="str">"\n"</span>);
}</pre></div>
        <p>Total iterations = outer × inner = 3 × 3 = 9. Used for patterns, matrices, tables.</p>`},
      { q:'What is the purpose of break statement?',
        a:`<p>The <strong>break</strong> statement immediately exits the current loop or switch statement, transferring control to the statement following the loop/switch.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>break.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">10</span>; i++) {
    <span class="kw">if</span>(i == <span class="num">5</span>) <span class="kw">break</span>;   <span class="cm">// Exit loop when i reaches 5</span>
    <span class="fn">printf</span>(<span class="str">"%d "</span>, i);     <span class="cm">// Prints: 1 2 3 4</span>
}</pre></div>
        <p>In switch statements, break prevents fall-through to the next case.</p>`},
      { q:'When is switch statement preferred over if-else?',
        a:`<p>switch is preferred over if-else when:</p>
        <ul>
        <li>Testing a <strong>single variable</strong> against multiple fixed values (integers or characters)</li>
        <li>There are <strong>many conditions</strong> to check (more readable than long if-else chains)</li>
        <li>All cases compare the <strong>same expression</strong> for equality</li>
        </ul>
        <div class="ib warn"><strong>Limitation of switch</strong>Cannot use ranges (e.g., marks &gt; 80), float values, or string comparisons — use if-else for those.</div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Predict the output of a given nested loop program. (Example: i from 1-3, j from 1 to i, print i*j)',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>nested_output.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">3</span>; i++) {
    <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">1</span>; j&lt;=i; j++) {
        <span class="fn">printf</span>(<span class="str">"%d "</span>, i*j);
    }
    <span class="fn">printf</span>(<span class="str">"\n"</span>);
}</pre></div>
        <h4>Trace</h4>
        <p>i=1: j goes 1→1 → prints: 1*1=1<br>i=2: j goes 1→2 → prints: 2*1=2, 2*2=4<br>i=3: j goes 1→3 → prints: 3*1=3, 3*2=6, 3*3=9</p>
        <div class="ib imp"><strong>Output</strong><code>1<br>2 4<br>3 6 9</code></div>`},
      { q:'Compare for, while, and do-while loops.',
        a:`<div class="tbl-wrap"><table><tr><th>Feature</th><th>for</th><th>while</th><th>do-while</th></tr>
        <tr><td>Condition check</td><td>Before body</td><td>Before body</td><td>After body</td></tr>
        <tr><td>Min executions</td><td>0</td><td>0</td><td>1</td></tr>
        <tr><td>Init in loop syntax</td><td>Yes</td><td>No</td><td>No</td></tr>
        <tr><td>Best used when</td><td>Count known</td><td>Condition known</td><td>Must run once</td></tr>
        <tr><td>Semicolon at end</td><td>No</td><td>No</td><td>Yes (while(cond);)</td></tr>
        </table></div>`},
      { q:'Analyze the use of break and continue.',
        a:`<h4>break</h4>
        <p>Immediately exits the current loop or switch block.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>break.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">10</span>; i++) {
    <span class="kw">if</span>(i == <span class="num">6</span>) <span class="kw">break</span>;
    <span class="fn">printf</span>(<span class="str">"%d "</span>, i);  <span class="cm">// Output: 1 2 3 4 5</span>
}</pre></div>
        <h4>continue</h4>
        <p>Skips the rest of the current iteration and jumps to the next iteration's condition check.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>continue.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">10</span>; i++) {
    <span class="kw">if</span>(i % <span class="num">2</span> == <span class="num">0</span>) <span class="kw">continue</span>;  <span class="cm">// Skip even numbers</span>
    <span class="fn">printf</span>(<span class="str">"%d "</span>, i);  <span class="cm">// Output: 1 3 5 7 9</span>
}</pre></div>`},
      { q:'Trace the execution of a switch-case statement.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>switch_trace.c</span></div><pre><span class="kw">int</span> day = <span class="num">2</span>;
<span class="kw">switch</span>(day) {
    <span class="kw">case</span> <span class="num">1</span>: <span class="fn">printf</span>(<span class="str">"Sunday"</span>);   <span class="kw">break</span>;
    <span class="kw">case</span> <span class="num">2</span>: <span class="fn">printf</span>(<span class="str">"Monday"</span>);   <span class="kw">break</span>;  <span class="cm">// Matches! Prints "Monday" then breaks</span>
    <span class="kw">case</span> <span class="num">3</span>: <span class="fn">printf</span>(<span class="str">"Tuesday"</span>);  <span class="kw">break</span>;
    <span class="kw">default</span>: <span class="fn">printf</span>(<span class="str">"Invalid"</span>);
}</pre></div>
        <p><strong>Trace:</strong> day=2 → matches case 2 → prints "Monday" → break exits switch.</p>
        <div class="ib warn"><strong>Fall-through without break</strong>Without break after case 2, execution would fall through to case 3, case default, etc. — all would print!</div>`},
      { q:'Write a logic to determine whether a year is leap year.',
        a:`<p>A year is a leap year if:</p>
        <ul><li>Divisible by 4 AND not divisible by 100, OR</li>
        <li>Divisible by 400</li></ul>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>leap_year.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> year;
    <span class="fn">printf</span>(<span class="str">"Enter year: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;year);

    <span class="kw">if</span>((year % <span class="num">4</span> == <span class="num">0</span> &amp;&amp; year % <span class="num">100</span> != <span class="num">0</span>) || (year % <span class="num">400</span> == <span class="num">0</span>))
        <span class="fn">printf</span>(<span class="str">"%d is a Leap Year\n"</span>, year);
    <span class="kw">else</span>
        <span class="fn">printf</span>(<span class="str">"%d is NOT a Leap Year\n"</span>, year);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Write a program to generate multiplication tables from 1 to 10.',

<span class="kw">int</span> <span class="fn">main</span>() {

        <span class="fn">printf</span>(<span class="str">"\nTable of %d:\n"</span>, i);
        <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">1</span>; j&lt;=<span class="num">10</span>; j++) {
            <span class="fn">printf</span>(<span class="str">"%d x %d = %d\n"</span>, i, j, i*j);
        }
    }
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Develop a program to determine whether a number is prime.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>prime.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> n, isPrime = <span class="num">1</span>;
    <span class="fn">printf</span>(<span class="str">"Enter a number: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;n);

    <span class="kw">if</span>(n &lt;= <span class="num">1</span>) isPrime = <span class="num">0</span>;  <span class="cm">// 0 and 1 are not prime</span>

    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">2</span>; i*i &lt;= n; i++) {
        <span class="kw">if</span>(n % i == <span class="num">0</span>) {
            isPrime = <span class="num">0</span>;
            <span class="kw">break</span>;
        }
    }

    <span class="kw">if</span>(isPrime)
        <span class="fn">printf</span>(<span class="str">"%d is Prime\n"</span>, n);
    <span class="kw">else</span>
        <span class="fn">printf</span>(<span class="str">"%d is NOT Prime\n"</span>, n);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <div class="ib imp"><strong>Optimization</strong>Check only up to √n (i*i &lt;= n) instead of i &lt; n — much faster!</div>`},
      { q:'Write a program to print Fibonacci series up to N terms.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>fibonacci.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> n, a=<span class="num">0</span>, b=<span class="num">1</span>, c;
    <span class="fn">printf</span>(<span class="str">"Enter number of terms: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;n);

    <span class="fn">printf</span>(<span class="str">"Fibonacci Series: "</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=n; i++) {
        <span class="fn">printf</span>(<span class="str">"%d "</span>, a);
        c = a + b;
        a = b;
        b = c;
    }
    <span class="fn">printf</span>(<span class="str">"\n"</span>);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <p>Output for n=8: <code>0 1 1 2 3 5 8 13</code></p>`},
      { q:'Explain all iterative statements with suitable examples.',
        a:`<h4>1. for Loop</h4>
        <p>Best when number of iterations is known. Syntax: for(init; condition; update)</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>for.c</span></div><pre><span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=<span class="num">5</span>; i++)
    <span class="fn">printf</span>(<span class="str">"%d "</span>, i);  <span class="cm">// 1 2 3 4 5</span></pre></div>
        <h4>2. while Loop</h4>
        <p>Entry-controlled. Condition checked before body. May run 0 times.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>while.c</span></div><pre><span class="kw">int</span> i=<span class="num">1</span>;
<span class="kw">while</span>(i &lt;= <span class="num">5</span>) { <span class="fn">printf</span>(<span class="str">"%d "</span>, i); i++; }  <span class="cm">// 1 2 3 4 5</span></pre></div>
        <h4>3. do-while Loop</h4>
        <p>Exit-controlled. Body always runs at least once.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>dowhile.c</span></div><pre><span class="kw">int</span> i=<span class="num">1</span>;
<span class="kw">do</span> { <span class="fn">printf</span>(<span class="str">"%d "</span>, i); i++; } <span class="kw">while</span>(i &lt;= <span class="num">5</span>);  <span class="cm">// 1 2 3 4 5</span></pre></div>`},
      { q:'Write a menu-driven calculator using switch statement.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>calculator.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">float</span> a, b;
    <span class="kw">int</span> choice;

    <span class="fn">printf</span>(<span class="str">"Enter two numbers: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%f %f"</span>, &amp;a, &amp;b);

    <span class="fn">printf</span>(<span class="str">"1.Add 2.Subtract 3.Multiply 4.Divide\n"</span>);
    <span class="fn">printf</span>(<span class="str">"Enter choice: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;choice);

    <span class="kw">switch</span>(choice) {
        <span class="kw">case</span> <span class="num">1</span>: <span class="fn">printf</span>(<span class="str">"Result = %.2f\n"</span>, a+b); <span class="kw">break</span>;
        <span class="kw">case</span> <span class="num">2</span>: <span class="fn">printf</span>(<span class="str">"Result = %.2f\n"</span>, a-b); <span class="kw">break</span>;
        <span class="kw">case</span> <span class="num">3</span>: <span class="fn">printf</span>(<span class="str">"Result = %.2f\n"</span>, a*b); <span class="kw">break</span>;
        <span class="kw">case</span> <span class="num">4</span>:
            <span class="kw">if</span>(b != <span class="num">0</span>) <span class="fn">printf</span>(<span class="str">"Result = %.2f\n"</span>, a/b);
            <span class="kw">else</span>       <span class="fn">printf</span>(<span class="str">"Error: Division by zero!\n"</span>);
            <span class="kw">break</span>;
        <span class="kw">default</span>: <span class="fn">printf</span>(<span class="str">"Invalid choice!\n"</span>);
    }
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
  ]
},
{
  id:'u4', title:'Functions and Storage Classes', short:'Functions & Storage',
  groups:[
    { label:'A', marks:3, qs:[
      { q:'Define function and mention its advantages.',
        a:`<p>A <strong>function</strong> is a self-contained, reusable block of code that performs a specific task. It executes when called.</p>
        <h4>Advantages</h4>
        <ul><li><strong>Reusability</strong> — Write once, call many times</li>
        <li><strong>Modularity</strong> — Break complex programs into smaller parts</li>
        <li><strong>Readability</strong> — Makes code easier to understand</li>
        <li><strong>Easier debugging</strong> — Errors isolated to specific functions</li>
        <li><strong>Reduces code duplication</strong></li></ul>`},
      { q:'What is recursion?',
        a:`<p><strong>Recursion</strong> is a programming technique where a function calls itself to solve a problem. Each recursive call works on a smaller sub-problem until reaching a <strong>base case</strong> that stops the recursion.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>recursion.c</span></div><pre><span class="kw">int</span> <span class="fn">factorial</span>(<span class="kw">int</span> n) {
    <span class="kw">if</span>(n == <span class="num">0</span>) <span class="kw">return</span> <span class="num">1</span>;        <span class="cm">// Base case</span>
    <span class="kw">return</span> n * <span class="fn">factorial</span>(n-<span class="num">1</span>); <span class="cm">// Recursive call</span>
}</pre></div>
        <div class="ib imp"><strong>Must Have Base Case!</strong>Without a base case, recursion runs infinitely → stack overflow.</div>`},
      { q:'Differentiate local and global variables.',
        a:`<div class="tbl-wrap"><table><tr><th>Local Variable</th><th>Global Variable</th></tr>
        <tr><td>Declared inside a function</td><td>Declared outside all functions</td></tr>
        <tr><td>Accessible only within that function</td><td>Accessible by all functions</td></tr>
        <tr><td>Created when function is called</td><td>Created at program start</td></tr>
        <tr><td>Destroyed when function returns</td><td>Destroyed when program ends</td></tr>
        <tr><td>Stored in stack memory</td><td>Stored in data segment</td></tr>
        </table></div>`},
      { q:'What is function prototype?',
        a:`<p>A <strong>function prototype</strong> (declaration) tells the compiler about a function's name, return type, and parameter types before the function is actually defined.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>prototype.c</span></div><pre><span class="kw">int</span> <span class="fn">add</span>(<span class="kw">int</span> a, <span class="kw">int</span> b);   <span class="cm">// Prototype — semicolon at end!</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> result = <span class="fn">add</span>(<span class="num">3</span>, <span class="num">4</span>);  <span class="cm">// Compiler knows add() exists</span>
    <span class="kw">return</span> <span class="num">0</span>;
}

<span class="kw">int</span> <span class="fn">add</span>(<span class="kw">int</span> a, <span class="kw">int</span> b) { <span class="kw">return</span> a+b; }  <span class="cm">// Definition below main</span></pre></div>`},
      { q:'List storage classes in C.',
        a:`<p>Storage classes define the <strong>scope</strong>, <strong>lifetime</strong>, and <strong>default value</strong> of a variable:</p>
        <div class="tbl-wrap"><table><tr><th>Storage Class</th><th>Keyword</th><th>Scope</th><th>Lifetime</th><th>Default</th></tr>
        <tr><td>Automatic</td><td>auto</td><td>Local (block)</td><td>Until block ends</td><td>Garbage</td></tr>
        <tr><td>External</td><td>extern</td><td>Global</td><td>Entire program</td><td>0</td></tr>
        <tr><td>Static</td><td>static</td><td>Local or Global</td><td>Entire program</td><td>0</td></tr>
        <tr><td>Register</td><td>register</td><td>Local</td><td>Until block ends</td><td>Garbage</td></tr>
        </table></div>`},
    ]},
    { label:'B', marks:5, qs:[
      { q:'Compare call by value and call by reference.',
        a:`<div class="tbl-wrap"><table><tr><th>Call by Value</th><th>Call by Reference</th></tr>
        <tr><td>Copy of variable passed</td><td>Address of variable passed</td></tr>
        <tr><td>Original NOT changed</td><td>Original IS changed</td></tr>
        <tr><td>Uses more memory (copy)</td><td>Uses less memory (address)</td></tr>
        <tr><td>Safer — no side effects</td><td>Can modify caller's data</td></tr>
        </table></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>callby.c</span></div><pre><span class="kw">void</span> <span class="fn">byVal</span>(<span class="kw">int</span> x)  { x = <span class="num">100</span>; }           <span class="cm">// a unchanged</span>
<span class="kw">void</span> <span class="fn">byRef</span>(<span class="kw">int</span> *x) { *x = <span class="num">100</span>; }          <span class="cm">// a changed to 100</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a = <span class="num">5</span>;
    <span class="fn">byVal</span>(a);          <span class="cm">// a still 5</span>
    <span class="fn">byRef</span>(&amp;a);         <span class="cm">// a now 100</span>
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Analyze recursive function execution.',
        a:`<p>When a function calls itself, each call is pushed onto the <strong>call stack</strong>. Execution unwinds when the base case is reached.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>trace factorial(3)</span></div><pre>factorial(3)
  → 3 * factorial(2)
        → 2 * factorial(1)
              → 1 * factorial(0)
                    → returns 1  [BASE CASE]
              → 1 * 1 = 1
        → 2 * 1 = 2
  → 3 * 2 = 6
Result: 6</pre></div>`},
      { q:'Explain the scope and lifetime of variables.',
        a:`<p><strong>Scope</strong> — where the variable can be accessed in code.<br>
        <strong>Lifetime</strong> — how long the variable exists in memory.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>scope.c</span></div><pre><span class="kw">int</span> global = <span class="num">10</span>;          <span class="cm">// Global: scope=all, lifetime=program</span>

<span class="kw">void</span> <span class="fn">func</span>() {
    <span class="kw">int</span> local = <span class="num">5</span>;         <span class="cm">// Local: scope=func only, lifetime=call</span>
    <span class="kw">static int</span> s = <span class="num">0</span>;      <span class="cm">// Static: scope=func, lifetime=program</span>
    s++;                    <span class="cm">// Retains value across calls!</span>
    <span class="fn">printf</span>(<span class="str">"%d\n"</span>, s);
}
<span class="cm">// func() called 3 times → prints 1, 2, 3</span></pre></div>`},
      { q:'Explain advantages and disadvantages of recursion.',
        a:`<h4>Advantages</h4>
        <ul><li>Makes code cleaner and more readable for problems like factorial, Fibonacci, tree traversal</li>
        <li>Solves naturally recursive problems elegantly (less code)</li>
        <li>Easier to understand the logic mathematically</li></ul>
        <h4>Disadvantages</h4>
        <ul><li><strong>Slower</strong> — function call overhead at each level</li>
        <li><strong>More memory</strong> — each call uses stack space (risk of stack overflow)</li>
        <li>Harder to debug/trace for deep recursion</li>
        <li>Iterative version is often more efficient</li></ul>`},
      { q:'Trace a function call with arguments.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>trace.c</span></div><pre><span class="kw">int</span> <span class="fn">add</span>(<span class="kw">int</span> x, <span class="kw">int</span> y) {
    <span class="kw">int</span> sum = x + y;
    <span class="kw">return</span> sum;
}
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a=<span class="num">5</span>, b=<span class="num">3</span>, result;
    result = <span class="fn">add</span>(a, b);
    <span class="fn">printf</span>(<span class="str">"%d\n"</span>, result);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <h4>Trace</h4>
        <ol><li>main() starts: a=5, b=3</li>
        <li>add(5,3) called: x=5, y=3 (copies)</li>
        <li>Inside add: sum = 5+3 = 8</li>
        <li>return 8 → result = 8 in main</li>
        <li>printf prints: <strong>8</strong></li></ol>`},
    ]},
    { label:'C', marks:10, qs:[
      { q:'Write a program using recursion to calculate factorial.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>factorial.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">long</span> <span class="fn">factorial</span>(<span class="kw">int</span> n) {
    <span class="kw">if</span>(n == <span class="num">0</span> || n == <span class="num">1</span>)
        <span class="kw">return</span> <span class="num">1</span>;                        <span class="cm">// Base case</span>
    <span class="kw">return</span> n * <span class="fn">factorial</span>(n - <span class="num">1</span>);       <span class="cm">// Recursive call</span>
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> n;
    <span class="fn">printf</span>(<span class="str">"Enter a number: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;n);

    <span class="kw">if</span>(n &lt; <span class="num">0</span>)
        <span class="fn">printf</span>(<span class="str">"Factorial undefined for negative numbers\n"</span>);
    <span class="kw">else</span>
        <span class="fn">printf</span>(<span class="str">"Factorial of %d = %ld\n"</span>, n, <span class="fn">factorial</span>(n));

    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Explain storage classes with examples.',
        a:`<h4>1. auto (Automatic)</h4>
        <p>Default for local variables. Created at function call, destroyed on return.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>auto.c</span></div><pre><span class="kw">void</span> <span class="fn">f</span>() { <span class="kw">auto int</span> x = <span class="num">5</span>; <span class="fn">printf</span>(<span class="str">"%d\n"</span>, x); }  <span class="cm">// x dies on return</span></pre></div>
        <h4>2. extern (External)</h4>
        <p>Declares a variable defined in another file. Lifetime = program.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>extern.c</span></div><pre><span class="kw">extern int</span> globalVar;  <span class="cm">// Defined elsewhere — use here</span></pre></div>
        <h4>3. static</h4>
        <p>Retains value between function calls. Default value = 0.</p>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>static.c</span></div><pre><span class="kw">void</span> <span class="fn">count</span>() {
    <span class="kw">static int</span> c = <span class="num">0</span>;  <span class="cm">// Initialized only once!</span>
    c++;
    <span class="fn">printf</span>(<span class="str">"Called %d times\n"</span>, c);
}
<span class="cm">// count() called 3 times → prints 1, 2, 3</span></pre></div>
        <h4>4. register</h4>
        <p>Hint to compiler to store in CPU register for faster access. Cannot take address with &amp;.</p>`},
      { q:'Write a program to find GCD using user-defined functions.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>gcd.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="cm">// Euclidean algorithm using recursion</span>
<span class="kw">int</span> <span class="fn">gcd</span>(<span class="kw">int</span> a, <span class="kw">int</span> b) {
    <span class="kw">if</span>(b == <span class="num">0</span>) <span class="kw">return</span> a;
    <span class="kw">return</span> <span class="fn">gcd</span>(b, a % b);
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> a, b;
    <span class="fn">printf</span>(<span class="str">"Enter two numbers: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d %d"</span>, &amp;a, &amp;b);
    <span class="fn">printf</span>(<span class="str">"GCD(%d, %d) = %d\n"</span>, a, b, <span class="fn">gcd</span>(a, b));
    <span class="fn">printf</span>(<span class="str">"LCM(%d, %d) = %d\n"</span>, a, b, (a*b)/<span class="fn">gcd</span>(a,b));
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Compare recursive and iterative approaches with suitable examples.',
        a:`<div class="tbl-wrap"><table><tr><th>Aspect</th><th>Recursive</th><th>Iterative</th></tr>
        <tr><td>Code length</td><td>Shorter, elegant</td><td>Longer but explicit</td></tr>
        <tr><td>Memory</td><td>More (call stack)</td><td>Less</td></tr>
        <tr><td>Speed</td><td>Slower (overhead)</td><td>Faster</td></tr>
        <tr><td>Risk</td><td>Stack overflow</td><td>Infinite loop</td></tr>
        <tr><td>Readability</td><td>Better for recursive problems</td><td>Better for simple loops</td></tr>
        </table></div>
        <div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>compare.c</span></div><pre><span class="cm">// Recursive factorial</span>
<span class="kw">int</span> <span class="fn">factRec</span>(<span class="kw">int</span> n) {
    <span class="kw">if</span>(n&lt;=<span class="num">1</span>) <span class="kw">return</span> <span class="num">1</span>;
    <span class="kw">return</span> n * <span class="fn">factRec</span>(n-<span class="num">1</span>);
}
<span class="cm">// Iterative factorial</span>
<span class="kw">int</span> <span class="fn">factIter</span>(<span class="kw">int</span> n) {
    <span class="kw">int</span> f = <span class="num">1</span>;
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">1</span>; i&lt;=n; i++) f *= i;
    <span class="kw">return</span> f;
}</pre></div>`},
      { q:'Develop a modular program using multiple functions.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>modular.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">float</span> <span class="fn">getInput</span>() {
    <span class="kw">float</span> n;
    <span class="fn">printf</span>(<span class="str">"Enter a number: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%f"</span>, &amp;n);
    <span class="kw">return</span> n;
}

<span class="kw">float</span> <span class="fn">square</span>(<span class="kw">float</span> x) { <span class="kw">return</span> x * x; }
<span class="kw">float</span> <span class="fn">cube</span>(<span class="kw">float</span> x)   { <span class="kw">return</span> x * x * x; }

<span class="kw">void</span> <span class="fn">displayResults</span>(<span class="kw">float</span> n) {
    <span class="fn">printf</span>(<span class="str">"Number  = %.2f\n"</span>, n);
    <span class="fn">printf</span>(<span class="str">"Square  = %.2f\n"</span>, <span class="fn">square</span>(n));
    <span class="fn">printf</span>(<span class="str">"Cube    = %.2f\n"</span>, <span class="fn">cube</span>(n));
}

<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">float</span> num = <span class="fn">getInput</span>();
    <span class="fn">displayResults</span>(num);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
    ]},
  ]
},

      { q:'Define one-dimensional array.',
        a:`<p>A <strong>one-dimensional array</strong> is a collection of multiple elements of the same data type stored in contiguous memory locations, accessed using a single index.</p>

<span class="cm">//  index:   [0] [1]  [2]  [3]  [4]</span>

        <div class="ib imp"><strong>Remember!</strong>Index starts at 0, not 1. Array of n elements uses indices 0 to n-1.</div>`},

        <p>The <code>'\0'</code> (null terminator) marks the end of the string and is added automatically when you use double quotes.</p>`},

    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;r; i++)
        <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">0</span>; j&lt;c; j++)
            <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;A[i][j]);

    <span class="fn">printf</span>(<span class="str">"Enter Matrix B:\n"</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;r; i++)
        <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">0</span>; j&lt;c; j++)
            <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;B[i][j]);

    <span class="fn">printf</span>(<span class="str">"Sum (A + B):\n"</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;r; i++) {

            C[i][j] = A[i][j] + B[i][j];

        }
        <span class="fn">printf</span>(<span class="str">"\n"</span>);
    }
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>`},
      { q:'Write a program to check whether a string is palindrome.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>palindrome.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="hd">#include &lt;string.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">char</span> s[<span class="num">100</span>], rev[<span class="num">100</span>];
    <span class="fn">printf</span>(<span class="str">"Enter a string: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%s"</span>, s);

    <span class="kw">int</span> len = <span class="fn">strlen</span>(s);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;len; i++)
        rev[i] = s[len-<span class="num">1</span>-i];
    rev[len] = <span class="str">'\0'</span>;

    <span class="kw">if</span>(<span class="fn">strcmp</span>(s, rev) == <span class="num">0</span>)

    <span class="kw">else</span>
        <span class="fn">printf</span>(<span class="str">"\"%s\" is NOT a Palindrome\n"</span>, s);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre></div>
        <p>Test: "madam" → reversed "madam" → equal → Palindrome!</p>`},
      { q:'Explain string handling functions with examples.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>string_funcs.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>

<span class="kw">int</span> <span class="fn">main</span>() {

    <span class="fn">printf</span>(<span class="str">"Length = %d\n"</span>, <span class="fn">strlen</span>(s1));     <span class="cm">// 5</span>

}</pre></div>`},
      { q:'Write a program to sort array elements in ascending order.',
        a:`<div class="cb"><div class="cb-header"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>bubble_sort.c</span></div><pre><span class="hd">#include &lt;stdio.h&gt;</span>
<span class="kw">int</span> <span class="fn">main</span>() {
    <span class="kw">int</span> n;
    <span class="fn">printf</span>(<span class="str">"Enter number of elements: "</span>);
    <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;n);

    <span class="kw">int</span> arr[n];
    <span class="fn">printf</span>(<span class="str">"Enter elements: "</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;n; i++) <span class="fn">scanf</span>(<span class="str">"%d"</span>, &amp;arr[i]);

    <span class="cm">// Bubble Sort</span>
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;n-<span class="num">1</span>; i++) {
        <span class="kw">for</span>(<span class="kw">int</span> j=<span class="num">0</span>; j&lt;n-i-<span class="num">1</span>; j++) {
            <span class="kw">if</span>(arr[j] &gt; arr[j+<span class="num">1</span>]) {

    <span class="fn">printf</span>(<span class="str">"Sorted: "</span>);
    <span class="kw">for</span>(<span class="kw">int</span> i=<span class="num">0</span>; i&lt;n; i++) <span class="fn">printf</span>(<span class="str">"%d "</span>, arr[i]);
