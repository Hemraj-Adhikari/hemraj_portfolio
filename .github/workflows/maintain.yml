# Keeps generated files fresh, then commits them back:
#   - minified CSS/JS and their ?v= cache-busting hashes
#   - sitemap.xml lastmod dates (from git history) and feed.xml
#   - CSP hashes in .htaccess
#   - assets/data/github.json (recent public repos for projects.html)
# Runs after every push to main, once a day, and on demand.
name: Maintain

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'   # 06:00 in Nepal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for sitemap lastmod dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh GitHub repositories
        run: npm run github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build assets, sitemap, feed and CSP
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(build): update assets, sitemap and GitHub data"
          git push

  external-links:
    name: External links (weekly report)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn, WhatsApp and Upwork block automated checks, so they are skipped
          args: >-
            --no-progress --max-concurrency 4 --accept 200..=299,403,429
            --exclude linkedin.com --exclude wa.me --exclude upwork.com
            --exclude-path node_modules
            "*.html"
          fail: false
          jobSummary: true
