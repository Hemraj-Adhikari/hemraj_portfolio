<!DOCTYPE html>
<html lang="en">
<head>

<title>BIT412 — C Programming Q&amp;A Bank</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0f1724;--surface2:#162032;--surface3:#1c2840;
  --accent:#00e5b8;--accent2:#ff6b35;--accent3:#a78bfa;--accent4:#38bdf8;
  --text:#dde6f0;--muted:#5a7080;--border:#1a2535;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1e3040;border-radius:99px}
header{background:linear-gradient(135deg,#080c14 0%,#130824 50%,#080c14 100%);border-bottom:1px solid var(--border);padding:16px 24px;position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:12}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:700;font-size:20px;color:#000;flex-shrink:0}
.header-title{font-size:17px;font-weight:700;color:var(--accent)}
.header-sub{font-size:12px;color:var(--muted)}
.exam-badge{background:rgba(255,107,53,.15);border:1px solid rgba(255,107,53,.4);border-radius:10px;padding:7px 16px;font-size:12px;font-weight:700;color:var(--accent2);font-family:monospace}
.menu-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer;color:var(--text);font-size:13px;display:none}
.layout{display:flex;min-height:calc(100vh - 77px)}
nav{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:77px;height:calc(100vh - 77px);overflow-y:auto}
main{flex:1;padding:32px 28px;max-width:880px;overflow-x:hidden}
.nav-section-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:0 18px 12px;display:block}
.unit-label{font-size:9px;font-weight:700;color:var(--accent3);letter-spacing:1.5px;text-transform:uppercase;padding:10px 18px 4px;margin-top:4px;display:block}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 18px;cursor:pointer;border-left:3px solid transparent;color:var(--muted);font-size:13px;transition:all .15s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-item.active{border-left-color:var(--accent);background:rgba(0,229,184,.07);color:var(--accent)}
.nav-badge{flex-shrink:0;width:22px;text-align:center;background:var(--surface3);border-radius:4px;padding:1px 5px;font-size:10px;font-family:monospace;font-weight:700;color:var(--muted)}
.nav-item.active .nav-badge{background:rgba(0,229,184,.2);color:var(--accent)}
.search-bar{width:100%;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;margin-bottom:10px}
.search-bar:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-btn{padding:5px 14px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:400;font-family:inherit;transition:all .15s}
.filter-btn.active{border-color:var(--accent);background:rgba(0,229,184,.1);color:var(--accent);font-weight:700}
.search-count{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center}
.page-eyebrow{display:inline-block;background:rgba(0,229,184,.12);color:var(--accent);border:1px solid rgba(0,229,184,.25);border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.page-title{font-size:26px;font-weight:700;line-height:1.25;margin-bottom:6px;color:var(--text)}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.group-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.qcard-header{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;cursor:pointer;transition:background .15s}
.qcard-header:hover{background:var(--surface2)}
.qcard.open .qcard-header{background:var(--surface2)}
.qcard.open{border-color:var(--surface3)}
.q-num{flex-shrink:0;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;font-weight:700;margin-top:1px}
.q-text{flex:1;font-size:14px;font-weight:600;line-height:1.55;color:var(--text)}
.q-chevron{flex-shrink:0;font-size:16px;color:var(--muted);transition:transform .25s;margin-top:2px}
.qcard.open .q-chevron{transform:rotate(180deg)}
.qcard-body{border-top:1px solid var(--border);padding:18px 20px;display:none}
.qcard.open .qcard-body{display:block}
.qcard-body pre{background:#060a10;border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;line-height:1.8;overflow-x:auto;white-space:pre;margin:10px 0;color:#e6edf3}
.qcard-body table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.qcard-body th{background:var(--surface3);padding:8px 12px;text-align:left;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border);font-size:12px}
.qcard-body td{padding:8px 12px;border-bottom:1px solid var(--border);color:#94a3b8;font-size:12px}
.qcard-body tr:last-child td{border-bottom:none}
.qcard-body tr:hover td{background:var(--surface2)}
.qcard-body h4{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 5px}
.qcard-body p{font-size:14px;line-height:1.75;color:#94a3b8;margin-bottom:6px}
.qcard-body ul,.qcard-body ol{padding-left:22px;margin:6px 0}
.qcard-body li{font-size:14px;line-height:1.75;color:#94a3b8;margin-bottom:4px}
.qcard-body code{background:var(--surface3);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px;color:var(--accent4)}
.qcard-body b,.qcard-body strong{color:var(--text)}
.ib{border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px;line-height:1.65}
.ib.tip{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:#c4b5fd}
.ib.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.ib.imp{background:rgba(0,229,184,.1);border:1px solid rgba(0,229,184,.3);color:#6ee7d4}
.nav-buttons{display:flex;align-items:center;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px}
.nav-page-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;font-size:13px;transition:all .2s}
.nav-page-btn:hover{border-color:var(--accent);background:rgba(0,229,184,.05)}
.btn-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn-title{font-weight:700;font-size:12px}
.nav-counter{font-size:11px;color:var(--muted);font-family:monospace}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300}
.mobile-nav{position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--surface);border-right:1px solid var(--border);z-index:301;overflow-y:auto;transform:translateX(-100%);transition:transform .25s}
.mobile-nav.open{transform:translateX(0)}
.overlay.open{display:block}
.mobile-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.search-result-unit{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.no-results{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:768px){
  nav{display:none}
  .menu-btn{display:block}
  main{padding:20px 16px}
}
</style>

<header>

<script>
const units = [
  {
    id:"u1", title:"Introduction to Programming & Problem Solving", short:"Intro & Problem Solving",
    groups:[
      { label:"A", marks:3, qs:[
        { q:"Define algorithm with an example.",
          a:`<p>An <b>algorithm</b> is a finite, ordered set of well-defined instructions to solve a problem.</p>
<h4>Properties</h4>
<ul><li><b>Finite</b> — must terminate after a fixed number of steps</li>
<li><b>Definite</b> — each step is clear and unambiguous</li>
<li><b>Input</b> — zero or more inputs</li>
<li><b>Output</b> — at least one output</li>
<li><b>Effective</b> — each step must be feasible</li></ul>
<h4>Example — Area of Rectangle</h4>
<pre>Step 1: Start
Step 2: Input length (l) and breadth (b)
Step 3: area = l × b
Step 4: Print area
Step 5: Stop</pre>` },
        { q:"Differentiate between compiler and interpreter.",
          a:`<table><tr><th>Compiler</th><th>Interpreter</th></tr>
<tr><td>Translates entire program at once</td><td>Translates line by line</td></tr>
<tr><td>Faster execution after compilation</td><td>Slower execution</td></tr>
<tr><td>Errors shown after full scan</td><td>Errors shown immediately</td></tr>
<tr><td>Generates object code (.exe / .o)</td><td>No object code generated</td></tr>
<tr><td>Example: GCC (C compiler)</td><td>Example: Python interpreter</td></tr></table>` },
        { q:"List any three characteristics of a good program.",
          a:`<ul>
<li><b>Reliability</b> — Produces correct output for all valid inputs</li>
<li><b>Readability</b> — Easy to understand; uses clear naming and comments</li>
<li><b>Efficiency</b> — Uses minimum memory and execution time</li>
<li><b>Portability</b> — Can run on different hardware/OS platforms</li>
<li><b>Maintainability</b> — Easy to modify, update, or extend</li></ul>` },
        { q:"What is a flowchart? Mention two advantages.",
          a:`<p>A <b>flowchart</b> is a diagrammatic representation of an algorithm using standardised symbols.</p>
<table><tr><th>Symbol</th><th>Shape</th><th>Meaning</th></tr>
<tr><td>Terminal</td><td>Oval</td><td>Start / Stop</td></tr>
<tr><td>Process</td><td>Rectangle</td><td>Calculation / Assignment</td></tr>
<tr><td>Decision</td><td>Diamond</td><td>Yes / No condition</td></tr>
<tr><td>I/O</td><td>Parallelogram</td><td>Input / Output</td></tr>
<tr><td>Flow</td><td>Arrow</td><td>Direction of control</td></tr></table>
<h4>Two Advantages</h4>
<ul><li>Makes logic easy to visualise before writing code</li>
<li>Helps in debugging by showing the decision flow clearly</li></ul>` },
        { q:"Explain the Program Development Life Cycle (PDLC).",
          a:`<ol>
<li><b>Problem Definition</b> — Understand and clearly state the problem</li>
<li><b>Problem Analysis</b> — Identify inputs, outputs, and constraints</li>
<li><b>Algorithm Design</b> — Write step-by-step solution (pseudocode / flowchart)</li>
<li><b>Coding</b> — Convert algorithm into C language</li>
<li><b>Testing &amp; Debugging</b> — Run the program; find and fix errors</li>
<li><b>Documentation &amp; Maintenance</b> — Write manuals; update as requirements change</li></ol>` },
      ]},
      { label:"B", marks:5, qs:[
        { q:"Draw a flowchart and write a program to find the largest of two numbers.",
          a:`<h4>Flowchart (text form)</h4>
<pre>[START] → [Input A, B] → Is A > B? → YES → Print A → [STOP]
                                    ↓ NO
                                  Print B → [STOP]</pre>
<h4>C Program</h4>
<pre>#include &lt;stdio.h&gt;
int main() {
    int a, b;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    if (a > b)
        printf("Largest = %d\n", a);
    else
        printf("Largest = %d\n", b);
    return 0;
}</pre>` },
        { q:"Compare machine language, assembly language, and high-level language.",
          a:`<table><tr><th>Feature</th><th>Machine Language</th><th>Assembly Language</th><th>High-Level Language</th></tr>
<tr><td>Form</td><td>Binary (0s &amp; 1s)</td><td>Mnemonics (ADD, MOV)</td><td>English-like (C, Python)</td></tr>
<tr><td>Readability</td><td>Very difficult</td><td>Difficult</td><td>Easy</td></tr>
<tr><td>Speed</td><td>Fastest</td><td>Fast</td><td>Slower</td></tr>
<tr><td>Portability</td><td>Not portable</td><td>Not portable</td><td>Portable</td></tr>
<tr><td>Translator</td><td>None needed</td><td>Assembler</td><td>Compiler / Interpreter</td></tr>
<tr><td>Example</td><td>10110000</td><td>MOV AX, BX</td><td>a = b + c;</td></tr></table>` },
        { q:"Analyze the steps involved in solving a programming problem.",
          a:`<ol>
<li><b>Understand the Problem</b> — Read carefully; identify what is given and required</li>
<li><b>Identify Inputs &amp; Outputs</b> — e.g. input = two numbers, output = sum</li>
<li><b>Design Algorithm</b> — Write logical steps in plain language or pseudocode</li>
<li><b>Draw Flowchart</b> — Visualise the logic with standard symbols</li>
<li><b>Write Code</b> — Implement algorithm in C</li>
<li><b>Compile &amp; Test</b> — Check for syntax and logic errors</li>
<li><b>Debug</b> — Fix all errors found during testing</li>
<li><b>Document</b> — Add comments and prepare user documentation</li></ol>` },
        { q:"Design an algorithm and program to calculate area and perimeter of a rectangle.",
          a:`<h4>Algorithm</h4>
<ol><li>Start</li><li>Input length (l) and breadth (b)</li>
<li>area = l × b</li><li>perimeter = 2 × (l + b)</li>
<li>Print area and perimeter</li><li>Stop</li></ol>
<pre>#include &lt;stdio.h&gt;
int main() {
    float l, b;
    printf("Enter length and breadth: ");
    scanf("%f %f", &l, &b);
    printf("Area      = %.2f\n", l * b);
    printf("Perimeter = %.2f\n", 2*(l+b));
    return 0;
}</pre>` },
      ]},
      { label:"C", marks:10, qs:[
        { q:"Explain the phases of problem-solving and program development with suitable examples.",
          a:`<h4>Phase 1 — Problem Definition</h4>
<p>Clearly state the problem. Example: "Find the sum of two numbers entered by the user."</p>
<h4>Phase 2 — Problem Analysis</h4>
<p>Input: two integers a, b &nbsp;|&nbsp; Output: sum = a + b &nbsp;|&nbsp; Constraints: integers only</p>
<h4>Phase 3 — Algorithm Design</h4>
<ol><li>Start</li><li>Input a, b</li><li>sum = a + b</li><li>Print sum</li><li>Stop</li></ol>
<h4>Phase 4 — Coding</h4>
<pre>#include &lt;stdio.h&gt;
int main() {
    int a, b, sum;
    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);
    sum = a + b;
    printf("Sum = %d\n", sum);
    return 0;
}</pre>
<h4>Phase 5 — Testing &amp; Debugging</h4>
<p>Run with test inputs: a=5, b=3 → expected output: 8. Fix any errors found.</p>
<h4>Phase 6 — Documentation</h4>
<p>Add comments to code; prepare user manuals; note maintenance guidelines.</p>` },
        { q:"Compare different generations of programming languages with examples.",
          a:`<table><tr><th>Generation</th><th>Name</th><th>Features</th><th>Example</th></tr>
<tr><td>1GL</td><td>Machine Language</td><td>Binary code, fastest, directly executed by CPU</td><td>10110000 01100001</td></tr>
<tr><td>2GL</td><td>Assembly Language</td><td>Mnemonics, needs assembler to convert</td><td>MOV AX, 01H</td></tr>
<tr><td>3GL</td><td>High-Level Language</td><td>English-like, portable, needs compiler</td><td>C, FORTRAN, COBOL</td></tr>
<tr><td>4GL</td><td>Very High-Level</td><td>Closer to human language, less code needed</td><td>SQL, MATLAB</td></tr>
<tr><td>5GL</td><td>AI / Natural Language</td><td>Problem-based, AI-driven reasoning</td><td>Prolog, LISP</td></tr></table>
<div class="ib tip">Key trend: each generation is more programmer-friendly but adds execution overhead.</div>` },
        { q:"Explain the complete structure of a C program with a suitable example.",
          a:`<pre>/* 1. Preprocessor Directives */
#include &lt;stdio.h&gt;        /* standard I/O */
#define PI 3.14159         /* symbolic constant */

/* 2. Global Variable */
int globalVar = 10;

/* 3. Function Prototype */
void greet();

/* 4. Main Function — entry point */
int main() {
    int a = 5, b = 3;
    printf("Sum = %d\n", a + b);
    greet();
    return 0;              /* 0 = success */
}

/* 5. User-Defined Function */
void greet() {
    printf("Hello from BIT412!\n");
}</pre>
<table><tr><th>Section</th><th>Purpose</th></tr>
<tr><td>#include</td><td>Includes library header files</td></tr>
<tr><td>#define</td><td>Defines symbolic constants</td></tr>
<tr><td>Global vars</td><td>Variables accessible by all functions</td></tr>
<tr><td>main()</td><td>Entry point; execution starts here</td></tr>
<tr><td>User functions</td><td>Reusable code blocks</td></tr></table>` },
      ]},
    ]
  },
  {
    id:"u2", title:"Data Types, Variables, Operators & I/O", short:"Data Types & Operators",
    groups:[
      { label:"A", marks:3, qs:[
        { q:"Define variable and constant with examples.",
          a:`<p><b>Variable:</b> A named memory location whose value <b>can change</b> during execution.<br/>
Declaration: <code>int age = 20;</code> &nbsp; <code>float gpa = 3.8;</code></p>
<p><b>Constant:</b> A named memory location whose value <b>cannot be changed</b> once assigned.</p>
<pre>const float PI = 3.14159;   /* const keyword */
#define MAX 100              /* preprocessor constant */</pre>` },
        { q:"What are the primitive data types in C? Give their sizes.",
          a:`<table><tr><th>Type</th><th>Size</th><th>Range</th><th>Format Specifier</th></tr>
<tr><td>int</td><td>2 / 4 bytes</td><td>−32,768 to 32,767 (2B)</td><td>%d</td></tr>
<tr><td>float</td><td>4 bytes</td><td>3.4×10⁻³⁸ to 3.4×10³⁸</td><td>%f</td></tr>
<tr><td>double</td><td>8 bytes</td><td>1.7×10⁻³⁰⁸ to 1.7×10³⁰⁸</td><td>%lf</td></tr>
<tr><td>char</td><td>1 byte</td><td>−128 to 127</td><td>%c</td></tr>
<tr><td>void</td><td>0 bytes</td><td>No value</td><td>—</td></tr>
<tr><td>long int</td><td>4 / 8 bytes</td><td>±2,147,483,647</td><td>%ld</td></tr>
<tr><td>unsigned int</td><td>2 / 4 bytes</td><td>0 to 65,535</td><td>%u</td></tr></table>` },
        { q:"Differentiate between scanf() and printf().",
          a:`<table><tr><th>scanf()</th><th>printf()</th></tr>
<tr><td>Used for INPUT (reading data from keyboard)</td><td>Used for OUTPUT (displaying data on screen)</td></tr>
<tr><td>Requires <code>&amp;</code> (address-of) operator for variables</td><td>Does NOT require <code>&amp;</code> operator</td></tr>
<tr><td>Returns number of items successfully read</td><td>Returns number of characters printed</td></tr>
<tr><td><code>scanf("%d", &amp;n);</code></td><td><code>printf("%d", n);</code></td></tr></table>
<div class="ib warn">Common mistake: forgetting <code>&amp;</code> in scanf causes undefined behavior!</div>` },
        { q:"What is type conversion? Explain with examples.",
          a:`<p><b>Implicit (Automatic):</b> Compiler converts smaller type to larger automatically.</p>
<pre>int a = 5;
float b = a;      /* b becomes 5.0 — int promoted to float */
int x = 3, y = 2;
float r = x / y;  /* r = 1.0 NOT 1.5 — division done as int first! */</pre>
<p><b>Explicit (Casting):</b> Programmer manually specifies the conversion.</p>
<pre>float x = 9.7;
int y = (int)x;          /* y = 9 (decimal truncated, NOT rounded) */
float r = (float)3 / 2;  /* r = 1.5 (cast before division) */</pre>` },
        { q:"Define identifier and mention its naming rules.",
          a:`<p>An <b>identifier</b> is a user-defined name given to a variable, function, array, or other entity in C.</p>
<h4>Rules</h4>
<ul>
<li>✔ Must start with a letter (a–z, A–Z) or underscore (_)</li>
<li>✔ Can contain letters, digits (0–9), and underscores</li>
<li>✘ Cannot start with a digit — <code>2name</code> is invalid</li>
<li>✘ Cannot use reserved keywords — <code>int</code>, <code>float</code>, <code>if</code>, etc.</li>
<li>✔ Case-sensitive: <code>Age</code> ≠ <code>age</code> ≠ <code>AGE</code></li>

        { q:"What is recursion? Give an example.",
          a:`<p><b>Recursion</b> is when a function calls <b>itself</b> to solve a smaller version of the same problem. Every recursive function must have a <b>base case</b> to stop the calls.</p>
<pre>int factorial(int n) {
    if (n == 0 || n == 1) return 1;  /* base case */
    return n * factorial(n - 1);     /* recursive call */
}
/* factorial(4) → 4×3×2×1 = 24 */</pre>
<div class="ib warn">Without a base case, recursion continues infinitely → stack overflow!</div>` },

<tr><td>Stored in <b>stack</b> memory</td><td>Stored in <b>data segment</b> memory</td></tr>

    printf("ABS(-5)       = %d\n",   ABS(-5));
    printf("Circle area(5)= %.2f\n", CIRCLE_AREA(5.0));
    printf("Is 4 even?    = %d\n",   IS_EVEN(4));
    printf("Is 7 odd?     = %d\n",   IS_ODD(7));
    return 0;
}</pre>` },
        { q:"Explain the complete preprocessing phase in C program compilation.",
          a:`<ol>
<li><b>Trigraph Replacement</b> — Special 3-character sequences replaced with single characters.</li>
<li><b>Line Splicing</b> — Lines ending with backslash (\\) joined with the next line.</li>
<li><b>Tokenisation</b> — Source code split into tokens: keywords, identifiers, literals, operators.</li>
<li><b>Directive Processing</b><ul>
<li><code>#include</code> — inserts entire content of the specified file</li>
<li><code>#define</code> — stores macro name and replacement text</li>
<li><code>#ifdef / #ifndef / #if</code> — includes or skips code sections</li>
<li><code>#undef</code> — removes a macro definition</li></ul></li>
<li><b>Macro Expansion</b> — Every macro identifier replaced with its definition text.</li>
<li><b>Output</b> — Resulting .i file contains no # directives; passed to compiler.</li></ol>
<div class="ib imp">View preprocessor output:<br/><code>gcc -E program.c -o program.i</code></div>
<table><tr><th>Phase</th><th>Tool</th><th>Input</th><th>Output</th></tr>
<tr><td>Preprocessing</td><td>cpp</td><td>program.c</td><td>program.i</td></tr>
<tr><td>Compilation</td><td>cc1</td><td>program.i</td><td>program.s (assembly)</td></tr>
<tr><td>Assembly</td><td>as</td><td>program.s</td><td>program.o (object)</td></tr>
<tr><td>Linking</td><td>ld</td><td>program.o + libs</td><td>a.out (executable)</td></tr></table>` },
      ]},
    ]
  },
];

/* ── State ── */
let activeSection = 'u1_A';
let openCards = new Set();
let currentFilter = 'all';

/* ── Helpers ── */
function groupColor(l) {
  return l==='A' ? 'var(--accent4)' : l==='B' ? 'var(--accent3)' : 'var(--accent2)';
}
function groupBg(l) {
  return l==='A' ? 'rgba(56,189,248,.12)' : l==='B' ? 'rgba(167,139,250,.12)' : 'rgba(255,107,53,.12)';
}
function groupBorder(l) {
  return l==='A' ? 'rgba(56,189,248,.3)' : l==='B' ? 'rgba(167,139,250,.3)' : 'rgba(255,107,53,.3)';
}
function qNumBg(l) {
  return l==='A' ? 'rgba(56,189,248,.15)' : l==='B' ? 'rgba(167,139,250,.15)' : 'rgba(255,107,53,.15)';
}
function groupEmoji(l) {
  return l==='A' ? '📝' : l==='B' ? '⚡' : '🔥';
}

/* flat sections list */
const allSections = units.flatMap(u => u.groups.map(g => ({
  key: `${u.id}_${g.label}`, unitId: u.id, label: g.label, marks: g.marks, unitTitle: u.short
})));

/* ── Build Sidebar ── */
function buildSidebar(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  let html = '<span class="nav-section-label">All Units</span>';
  units.forEach(u => {
    html += `<span class="unit-label">${u.short}</span>`;
    u.groups.forEach(g => {
      const key = `${u.id}_${g.label}`;
      const active = activeSection === key ? 'active' : '';
      html += `<div class="nav-item ${active}" data-key="${key}" onclick="navigate('${key}')">
        <span class="nav-badge">${g.label}</span>
        Group ${g.label} (${g.marks} marks)
      </div>`;
    });
  });
  el.innerHTML = html;
}

/* ── Render Section ── */
function renderSection() {
  const parts = activeSection.split('_');
  const activeUnit = units.find(u => u.id === parts[0]);
  const activeGroup = activeUnit && activeUnit.groups.find(g => g.label === parts[1]);
  if (!activeUnit || !activeGroup) return;

  const curIdx = allSections.findIndex(s => s.key === activeSection);
  const prev = curIdx > 0 ? allSections[curIdx-1] : null;
  const next = curIdx < allSections.length-1 ? allSections[curIdx+1] : null;

  let cardsHTML = '';
  activeGroup.qs.forEach((item, qi) => {
    const id = `${activeSection}_${qi}`;
    const open = openCards.has(id) ? 'open' : '';
    const numBg = qNumBg(activeGroup.label);
    const numC = groupColor(activeGroup.label);
    cardsHTML += `
      <div class="qcard ${open}" id="card-${id}">
        <div class="qcard-header" onclick="toggleCard('${id}')">
          <div class="q-num" style="background:${numBg};color:${numC}">Q${qi+1}</div>
          <span class="q-text">${item.q}</span>
          <span class="q-chevron">▾</span>
        </div>
        <div class="qcard-body">${item.a}</div>
      </div>`;
  });

  const prevBtn = prev ? `<button class="nav-page-btn" onclick="navigate('${prev.key}')">
    ← <div><div class="btn-label">Previous</div><div class="btn-title">${prev.unitTitle} · ${prev.label}</div></div>
  </button>` : '<div></div>';

  const nextBtn = next ? `<button class="nav-page-btn" onclick="navigate('${next.key}')">
    <div style="text-align:right"><div class="btn-label">Next</div><div class="btn-title">${next.unitTitle} · ${next.label}</div></div> →
  </button>` : '<div></div>';

  document.getElementById('content-area').innerHTML = `
    <div>
      <div class="page-eyebrow">${activeUnit.short}</div>
      <h2 class="page-title">${activeUnit.title}</h2>
      <p class="page-sub">${activeUnit.id.replace('u','Unit ')} — Group ${activeGroup.label} Questions (${activeGroup.marks} marks each) — ${activeGroup.qs.length} questions</p>
    </div>
    <div class="group-badge" style="background:${groupBg(activeGroup.label)};border:1px solid ${groupBorder(activeGroup.label)};color:${groupColor(activeGroup.label)}">
      ${groupEmoji(activeGroup.label)} Group ${activeGroup.label} — ${activeGroup.marks} Marks Each
    </div>
    ${cardsHTML}
    <div class="nav-buttons">
      <span class="nav-counter"><span style="color:var(--accent)">${curIdx+1}</span> / ${allSections.length}</span>
      ${prevBtn}
      ${nextBtn}
    </div>`;
}

/* ── Search ── */
function renderSearch(query) {
  const q = query.toLowerCase().trim();
  const results = [];
  units.forEach(u => u.groups.forEach(g => {
    if (currentFilter !== 'all' && g.label !== currentFilter) return;
    g.qs.forEach((item, qi) => {
      if (item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q)) {
        results.push({ unitTitle: u.short, item, gLabel: g.label, id: `${u.id}_${g.label}_${qi}` });
      }
    });
  }));

  document.getElementById('searchCount').style.display = 'flex';
  document.getElementById('searchCount').innerHTML = `Found <b style="color:var(--text);margin:0 4px">${results.length}</b> results`;

  if (results.length === 0) {
    document.getElementById('content-area').innerHTML = '<div class="no-results">No questions found. Try a different term.</div>';
    return;
  }

  let html = '';
  results.forEach(({ unitTitle, item, gLabel, id }) => {
    const open = openCards.has(id) ? 'open' : '';
    const numBg = qNumBg(gLabel);
    const numC = groupColor(gLabel);
    html += `
      <div class="search-result-unit">${unitTitle} · Group ${gLabel}</div>
      <div class="qcard ${open}" id="card-${id}">
        <div class="qcard-header" onclick="toggleCard('${id}')">
          <div class="q-num" style="background:${numBg};color:${numC}">Q</div>
          <span class="q-text">${item.q}</span>
          <span class="q-chevron">▾</span>
        </div>
        <div class="qcard-body">${item.a}</div>
      </div>`;
  });
  document.getElementById('content-area').innerHTML = html;
}

/* ── Actions ── */
function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  if (openCards.has(id)) {
    openCards.delete(id);
    card.classList.remove('open');
  } else {
    openCards.add(id);
    card.classList.add('open');
  }
}

function navigate(key) {
  activeSection = key;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchCount').style.display = 'none';
  currentFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('filter-all').classList.add('active');
  buildSidebar('sidebar');
  buildSidebar('mobileSidebar');
  renderSection();
  closeMobileNav();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('filter-' + f).classList.add('active');
  const q = document.getElementById('searchInput').value;
  if (q.trim()) renderSearch(q);
}

function handleSearch() {
  const q = document.getElementById('searchInput').value;
  if (q.trim()) {
    renderSearch(q);
  } else {
    document.getElementById('searchCount').style.display = 'none';
    renderSection();
  }
}

function toggleMobileNav() {
  document.getElementById('mobileNav').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function closeMobileNav() {
  document.getElementById('mobileNav').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

/* ── Init ── */
buildSidebar('sidebar');
buildSidebar('mobileSidebar');
renderSection();
</script>
</body>
</html>
